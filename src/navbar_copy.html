<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dock</title>
<!-- macOS-style dock, single file. Source: https://codepen.io/vihanga/pen/gOmXvRr
     SCSS flattened to plain CSS; page background removed.
     FLIPPED VERTICALLY: the dock hangs from the top of the page. Tooltips drop below the icons
     (arrow points up), icons magnify downward, and the transform origin is the top edge. -->
<style>
*,
html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "San Francisco";
}
@font-face {
  font-family: "San Francisco";
  font-weight: 400;
  src: url("assets/sanfranciscodisplay-regular-webfont.woff");
}
.dock {
  width: auto;
  height: 60px;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  position: absolute;
  top: 20px;              /* was bottom: 20px */
  left: 50%;
  transform: translateX(-50%);
}
.dock .dock-container {
  padding: 3px;
  width: auto;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: rgba(83, 83, 83, 0.25);
  backdrop-filter: blur(13px);
  -webkit-backdrop-filter: blur(13px);
  border: 1px solid rgba(255, 255, 255, 0.18);
}
.dock .dock-container .li-bin {
  margin-left: 20px;
  border-left: 1.5px solid rgba(255, 255, 255, 0.4);
  padding: 0px 10px;
}
.dock .dock-container .li-1::after {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  content: "";
  bottom: 2px;
}
.dock .dock-container li {
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  height: 50px;
  vertical-align: top;
  transition: 0.2s;
  transform-origin: 50% 0;   /* was 50% 100% */
}
.dock .dock-container li:hover {
  margin: 0px 13px 0px 13px;
}
.dock .dock-container li .name {
  position: absolute;
  top: 100px;              /* was top: -70px (above); now the same 40px gap, below */
  background: rgba(0, 0, 0, 0.5);
  color: rgba(255, 255, 255, 0.9);
  height: 10px;
  padding: 10px 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  visibility: hidden;
}
.dock .dock-container li .name::after {
  content: "";
  position: absolute;
  top: -10px;              /* was bottom: -10px */
  width: 0;
  height: 0;
  backdrop-filter: blur(13px);
  -webkit-backdrop-filter: blur(13px);
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 10px solid rgba(0, 0, 0, 0.5);   /* arrow points up at the icon */
}
.dock .dock-container li .ico {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: 0.2s;
  display: inline-block;
  transition: transform 0.3s ease;
}
.dock .dock-container li .ico-bin {
  width: 94% !important;
  height: 94% !important;
  object-fit: cover;
  transition: 0.2s;
}
.dock .dock-container li .ico-bin:hover {
  margin-left: 10px;
}
.dock .dock-container li:hover .name {
  visibility: visible !important;
}
</style>
</head>
<body>
<div class="dock">
  <div class="dock-container">
    <li class="li-4">
      <div class="name">ContactMe</div>
      <img class="ico" src="media/icon-contactme.png" alt="">
    </li>
    <li class="li-5">
      <div class="name">Resume</div>
      <img class="ico" src="media/icon-resume.png" alt="">
    </li>
    <li class="li-7">
      <div class="name">Photos</div>
      <img class="ico" src="media/icon-photos.png" alt="">
    </li>
    <li class="li-8">
      <div class="name">Terminal</div>
      <img class="ico" src="media/icon-terminal.png" alt="">
    </li>
    <li class="li-10">
      <div class="name">Music</div>
      <img class="ico" src="media/icon-music.png" alt="">
    </li>
    <li class="li-12">
      <div class="name">Movies</div>
      <img class="ico" src="media/icon-movies.png" alt="">
    </li>
    <li class="li-12">
      <div class="name">Projects</div>
      <img class="ico" src="media/icon-projects.png" alt="">
    </li>
    <li class="li-bin li-15">
      <div class="name">Bin</div>
      <img class="ico ico-bin" src="media/icon-bin.png" alt="">
    </li>
  </div>
</div>

<script>
const icons = document.querySelectorAll(".ico");

const resetIcons = () => {
  icons.forEach((item) => {
    item.style.transform = "scale(1) translateY(0px)";
  });
};

icons.forEach((item, index) => {
  item.addEventListener("mouseover", () => focus(index));
  item.addEventListener("mouseleave", resetIcons);
});

const focus = (index) => {
  resetIcons();
  const transformations = [
    { idx: index - 2, scale: 1.1, translateY: 0 },
    { idx: index - 1, scale: 1.2, translateY: 6 },
    { idx: index, scale: 1.5, translateY: 10 },
    { idx: index + 1, scale: 1.2, translateY: 6 },
    { idx: index + 2, scale: 1.1, translateY: 0 }
  ];

  transformations.forEach(({ idx, scale, translateY }) => {
    if (icons[idx]) {
      icons[
        idx
      ].style.transform = `scale(${scale}) translateY(${translateY}px)`;
    }
  });
};
</script>
</body>
</html>
