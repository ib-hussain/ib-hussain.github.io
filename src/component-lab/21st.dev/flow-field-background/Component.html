<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Flow Field Background</title>
<!--
  Flow Field Background — standalone port of flow-field-background.tsx (NeuralBackground)
  and its Usage.tsx demo. Plain HTML + CSS + JS: no build step, no dependencies,
  works as-is on GitHub Pages.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }

  /* Usage.tsx: <div className="h-screen w-screen"> */
  .screen { height: 100vh; width: 100vw; }

  /* Component: "relative w-full h-full bg-black overflow-hidden" */
  .neural-bg { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
  /* Canvas: "block w-full h-full" (init() then pins the exact pixel size, as the original does) */
  .neural-bg canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <!-- Container must have a defined height, or use h-screen -->
  <div class="screen" id="screen"></div>

<script>
"use strict";

/**
 * @param {HTMLElement} host
 * @param {{
 *   className?: string,
 *   color?: string,           // colour of the particles
 *   trailOpacity?: number,    // 0..1, lower = longer trails
 *   particleCount?: number,
 *   speed?: number            // speed multiplier
 * }} props
 * @returns {() => void} cleanup
 */
function NeuralBackground(host, props) {
  const o = Object.assign({
    className: "",
    color: "#6366f1",        // default indigo
    trailOpacity: 0.15,
    particleCount: 600,
    speed: 1,
  }, props || {});
  const color = o.color;
  const trailOpacity = o.trailOpacity;
  const particleCount = o.particleCount;
  const speed = o.speed;

  const container = document.createElement("div");
  container.className = "neural-bg" + (o.className ? " " + o.className : "");
  const canvas = document.createElement("canvas");
  container.appendChild(canvas);
  host.appendChild(container);

  const ctx = canvas.getContext("2d");
  if (!ctx) return function () {};

  // --- CONFIGURATION ---
  let width = container.clientWidth;
  let height = container.clientHeight;
  let particles = [];
  let animationFrameId = 0;
  const mouse = { x: -1000, y: -1000 }; // start off-screen

  // --- PARTICLE CLASS ---
  class Particle {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = 0;
      this.vy = 0;
      this.age = 0;
      // Random lifespan to create natural recycling
      this.life = Math.random() * 200 + 100;
    }

    update() {
      // 1. Flow field maths: an angle from position makes the "flow"
      const angle = (Math.cos(this.x * 0.005) + Math.sin(this.y * 0.005)) * Math.PI;

      // 2. Add force from the flow field
      this.vx += Math.cos(angle) * 0.2 * speed;
      this.vy += Math.sin(angle) * 0.2 * speed;

      // 3. Mouse repulsion
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const interactionRadius = 150;

      if (distance < interactionRadius) {
        const force = (interactionRadius - distance) / interactionRadius;
        // Push away
        this.vx -= dx * force * 0.05;
        this.vy -= dy * force * 0.05;
      }

      // 4. Apply velocity and friction
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95; // friction stops infinite acceleration
      this.vy *= 0.95;

      // 5. Ageing
      this.age++;
      if (this.age > this.life) {
        this.reset();
      }

      // 6. Wrap around the screen
      if (this.x < 0) this.x = width;
      if (this.x > width) this.x = 0;
      if (this.y < 0) this.y = height;
      if (this.y > height) this.y = 0;
    }

    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = 0;
      this.vy = 0;
      this.age = 0;
      this.life = Math.random() * 200 + 100;
    }

    draw(context) {
      context.fillStyle = color;
      // Fade in and out based on age
      const alpha = 1 - Math.abs(this.age / this.life - 0.5) * 2;
      context.globalAlpha = alpha;
      context.fillRect(this.x, this.y, 1.5, 1.5); // tiny dots are faster than arcs
    }
  }

  // --- INITIALISATION ---
  const init = () => {
    // Handle high-DPI screens
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }
  };

  // --- ANIMATION LOOP ---
  const animate = () => {
    // "Fade" effect: instead of clearing the canvas, draw a semi-transparent
    // rectangle. That is what creates the trails.
    ctx.fillStyle = "rgba(0, 0, 0, " + trailOpacity + ")";
    ctx.fillRect(0, 0, width, height);

    particles.forEach((p) => {
      p.update();
      p.draw(ctx);
    });

    animationFrameId = requestAnimationFrame(animate);
  };

  // --- EVENT LISTENERS ---
  const handleResize = () => {
    width = container.clientWidth;
    height = container.clientHeight;
    init();
  };

  const handleMouseMove = (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  };

  const handleMouseLeave = () => {
    mouse.x = -1000;
    mouse.y = -1000;
  };

  // Start
  init();
  animate();

  window.addEventListener("resize", handleResize);
  container.addEventListener("mousemove", handleMouseMove);
  container.addEventListener("mouseleave", handleMouseLeave);

  return function cleanup() {
    window.removeEventListener("resize", handleResize);
    container.removeEventListener("mousemove", handleMouseMove);
    container.removeEventListener("mouseleave", handleMouseLeave);
    cancelAnimationFrame(animationFrameId);
    container.remove();
  };
}

/* ── Usage.tsx ──────────────────────────────────────────────── */
const settings = {
  scale: 1,          // passed by the demo; the component has no such prop, so it is ignored there too
  trailOpacity: 0.1, // lower = longer trails
  speed: 0.8,
};

NeuralBackground(document.getElementById("screen"), {
  color: "#818cf8", // indigo-400
  scale: settings.scale,
  trailOpacity: settings.trailOpacity,
  speed: settings.speed,
});
</script>
</body>
</html>
