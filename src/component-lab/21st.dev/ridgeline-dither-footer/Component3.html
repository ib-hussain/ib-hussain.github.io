<html lang="en-GB">

<title>ib_hussain — Ridgeline Dither Footer</title>
<!--
  Ridgeline Dither Footer — standalone port of ridgeline-dither-footer.tsx
  (Usage.tsx demo). Plain HTML + CSS + JS, nothing to build, GitHub Pages ready.

  Changes from the React original, as requested:
   • The range is the skyline of Pakistan's mountains, in shades of snow white, laid out west → east
     as a schematic cross-section. Real summit heights set the crest heights.
   • K2 (8,611 m), Nanga Parbat (8,126 m) and Rakaposhi (7,788 m) carry permanent labels
     (name, height, location). The other summits are unlabelled.
   • The hover altimeter is back: it rides the crest under the pointer and reads its height.
   • The logo is the wilted-rose image, embedded below as a data URI (no extra files to host).
   • The copyright line and the "Made with ♥ by …" credit line are removed.
   • Text in the footer is limited to the handles ib_hussain, ib-hussain and ib_hussain@archlinux.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html, body { margin: 0; }
body { background: #0d1524; /* the footer's paper, so no seam shows below it */ }

/* ───────── Footer styles, scoped with .rdf- exactly as in the component ───────── */

.rdf-root {
  position: relative; display: grid; width: 100%; overflow: hidden; isolation: isolate;
  background: var(--rdf-paper); color: var(--rdf-ink); font-family: var(--rdf-sans);
  -webkit-font-smoothing: antialiased; --rdf-pad: clamp(20px, 3.2vw, 30px);
}
.rdf-frame {
  position: relative; display: grid; grid-template-rows: auto minmax(var(--rdf-scene-min), 1fr);
  width: 100%; max-width: var(--rdf-max); margin: 0 auto;
}
.rdf-frame::before, .rdf-frame::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 1px; z-index: 3; pointer-events: none;
  background: var(--rdf-line); transform: scaleY(0); transform-origin: 50% 0;
  transition: transform 1.4s cubic-bezier(.2,.7,.1,1);
}
.rdf-frame::before { left: 0; }
.rdf-frame::after { right: 0; transition-delay: .08s; }
.rdf-in .rdf-frame::before, .rdf-in .rdf-frame::after { transform: scaleY(1); }

.rdf-r {
  opacity: 0; transform: translateY(12px); filter: blur(5px);
  transition: opacity .9s cubic-bezier(.2,.7,.1,1), transform 1s cubic-bezier(.2,.7,.1,1), filter .9s ease;
  transition-delay: calc(var(--d, 0) * 1ms);
}
.rdf-in .rdf-r { opacity: 1; transform: none; filter: none; }

.rdf-top {
  position: relative; z-index: 2; display: grid;
  grid-template-columns: minmax(0, 1.9fr) repeat(var(--rdf-n), minmax(0, 1fr));
  gap: 28px; padding: clamp(44px, 6.4vw, 80px) var(--rdf-pad) clamp(30px, 4vw, 52px);
}
.rdf-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
.rdf-logo {
  display: inline-flex; align-items: center; gap: 10px; color: var(--rdf-ink); text-decoration: none;
  font-size: 23px; font-weight: 500; letter-spacing: -.035em; line-height: 1;
}
.rdf-mark { width: 30px; height: 21px; display: block; overflow: visible; }
.rdf-mark-img { height: 38px; width: auto; display: block; transform-origin: 20% 100%; transition: transform .7s cubic-bezier(.2,.7,.1,1); }
.rdf-logo:hover .rdf-mark-img { transform: rotate(-5deg); }
.rdf-logo span { font-family: var(--rdf-mono); font-size: 21px; letter-spacing: -.02em; }
.rdf-copy {
  position: relative; display: inline-flex; align-items: center; gap: 9px; margin: 0; padding: 0;
  border: 0; background: none; cursor: pointer; text-align: left;
  color: var(--rdf-ink); font: 400 13.5px/1.35 var(--rdf-mono); letter-spacing: -.01em;
  transition: color .3s ease, transform .5s cubic-bezier(.2,.7,.1,1);
}
.rdf-copy svg { width: 12px; height: 12px; flex: none; opacity: 0; color: var(--rdf-muted); transition: opacity .25s ease; }
.rdf-copy:hover, .rdf-copy:focus-visible { color: var(--rdf-accent); transform: translateX(7px); }
.rdf-copy:hover svg, .rdf-copy:focus-visible svg { opacity: 1; }
.rdf-copy:focus-visible { outline: 1px solid var(--rdf-accent); outline-offset: 4px; border-radius: 3px; }
.rdf-copy::after {
  content: "Copied"; position: absolute; left: calc(100% + 10px); top: 50%; translate: 0 -50%;
  font: 500 9px/1 var(--rdf-mono); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
  padding: 4px 6px 3px; border-radius: 99px; color: var(--rdf-paper); background: var(--rdf-accent);
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.rdf-copy.rdf-done::after { opacity: 1; }
.rdf-copy.rdf-done svg { opacity: 0; }
.rdf-mark rect { fill: var(--rdf-paper); transition: transform .7s cubic-bezier(.2,.7,.1,1); }
.rdf-logo:hover .rdf-mist-a { transform: translateX(4px); }
.rdf-logo:hover .rdf-mist-b { transform: translateX(-5px); }
.rdf-tag { margin: 0; max-width: 30ch; font-size: 13.5px; line-height: 1.55; color: var(--rdf-muted); text-wrap: pretty; }
.rdf-social { display: flex; gap: 6px; margin: 2px 0 0 -7px; padding: 0; list-style: none; }
.rdf-social a {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--rdf-muted);
  transition: color .3s ease, background-color .3s ease, transform .45s cubic-bezier(.2,.7,.1,1);
}
.rdf-social a:hover { color: var(--rdf-ink); background: color-mix(in srgb, var(--rdf-deep) 8%, transparent); transform: translateY(-2px); }
.rdf-social svg { width: 15px; height: 15px; display: block; }

.rdf-col h3 {
  margin: 4px 0 18px; font: 500 10.5px/1 var(--rdf-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--rdf-muted);
}
.rdf-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.rdf-link {
  position: relative; display: inline-flex; align-items: center; gap: 8px;
  color: var(--rdf-ink); text-decoration: none; font-size: 14px; line-height: 1.35; letter-spacing: -.005em;
  transition: color .3s ease, transform .5s cubic-bezier(.2,.7,.1,1);
}
.rdf-link::before {
  content: ""; position: absolute; left: -12px; top: 50%; width: 7px; height: 1px; background: var(--rdf-accent);
  transform: scaleX(0); transform-origin: 0 50%; transition: transform .45s cubic-bezier(.2,.7,.1,1);
}
a.rdf-link:hover { color: var(--rdf-accent); transform: translateX(7px); }
a.rdf-link:hover::before { transform: scaleX(1); }
.rdf-badge {
  font: 500 9px/1 var(--rdf-mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 99px;
  color: var(--rdf-accent); background: color-mix(in srgb, var(--rdf-accent) 11%, transparent);
}
.rdf-link:focus-visible, .rdf-logo:focus-visible, .rdf-social a:focus-visible {
  outline: 1px solid var(--rdf-accent); outline-offset: 4px; border-radius: 3px;
}

.rdf-scene { position: relative; z-index: 1; margin-top: -64px; overflow: hidden; }
.rdf-scene canvas {
  position: absolute; left: 0; bottom: 0; display: block; max-width: none;
  image-rendering: pixelated; image-rendering: crisp-edges;
}

/* ───────── Altimeter: rides the crest under the pointer ───────── */
.rdf-alt {
  position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; opacity: 0;
  transition: opacity .35s ease; font: 500 10px/1 var(--rdf-mono); letter-spacing: .08em; color: var(--rdf-ink);
}
.rdf-alt i {
  position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--rdf-paper); box-shadow: 0 0 0 1.5px var(--rdf-ink);
}
.rdf-alt b { position: absolute; left: -.5px; bottom: 6px; width: 1px; height: 26px; background: var(--rdf-ink); opacity: .55; }
.rdf-alt.rdf-below b { bottom: auto; top: 6px; }
.rdf-alt.rdf-below span { bottom: auto; top: 34px; }
.rdf-alt span {
  position: absolute; left: 0; bottom: 34px; transform: translateX(-50%); white-space: nowrap; padding: 5px 7px 4px;
  border-radius: 5px; background: color-mix(in srgb, var(--rdf-paper) 88%, transparent); box-shadow: 0 0 0 1px var(--rdf-line);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}

/* ───────── Peak labels: always visible, no hover, no highlight ───────── */
.rdf-peaks { position: absolute; inset: 0; z-index: 2; margin: 0; padding: 0; list-style: none; pointer-events: none; }
.rdf-peak { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; will-change: transform, opacity; }
.rdf-peak-dot {
  position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--rdf-paper); box-shadow: 0 0 0 1.5px var(--rdf-ink);
}
.rdf-peak-line { position: absolute; left: -.5px; bottom: 3px; width: 1px; height: calc(var(--len, 12px) - 3px); background: var(--rdf-ink); opacity: .5; }
.rdf-peak-label {
  position: absolute; left: 0; bottom: calc(var(--len, 12px) + 6px);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  white-space: nowrap; text-align: center;
  text-shadow: 0 0 10px var(--rdf-paper), 0 0 3px var(--rdf-paper);
}
.rdf-peak-label strong { font: 500 10.5px/1.1 var(--rdf-mono); letter-spacing: .04em; color: var(--rdf-ink); }
.rdf-peak-label small { font: 400 9px/1.1 var(--rdf-mono); letter-spacing: .06em; color: var(--rdf-muted); }

@media (max-width: 760px) {
  .rdf-top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); row-gap: 36px; }
  .rdf-brand { grid-column: 1 / -1; }
  .rdf-scene { margin-top: -40px; }
}
@media (max-width: 560px) {
  .rdf-peak-label strong { font-size: 9px; }
  .rdf-peak-label small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .rdf-r, .rdf-frame::before, .rdf-frame::after, .rdf-link, .rdf-link::before, .rdf-social a, .rdf-mark rect, .rdf-mark-img, .rdf-copy { transition: none; }
  .rdf-r { filter: none; }
}
</style>
</head>
<body>
<div id="footer-host"></div>

<script>
"use strict";

/* ═════════════════════════════════════════════════════════════════
   Palettes. The first five are the component's own; "karakoram" is new:
   snow tones on a deep alpine-night paper, from valley haze to fresh snow.
   ═════════════════════════════════════════════════════════════════ */
const PRESETS = {
  evergreen: {
    paper: "#f3f8f5", ink: "#14211a", muted: "#67776e", line: "#dce8e1", heart: "#e5484d",
    tones: ["#f3f8f5", "#d4ecdf", "#a5d7bb", "#69b38a", "#2e7c52", "#145131", "#0a2d1a"],
  },
  glacier: {
    paper: "#f2f6fa", ink: "#121b26", muted: "#637184", line: "#dae3ed", heart: "#e5484d",
    tones: ["#f2f6fa", "#d6e6f4", "#a8cae7", "#6b9ecc", "#34679a", "#1a3e66", "#0b2140"],
  },
  dusk: {
    paper: "#f8f4f7", ink: "#21151f", muted: "#7a6876", line: "#ecdfe8", heart: "#e5484d",
    tones: ["#f8f4f7", "#efdbe7", "#d9b2cb", "#b1789f", "#7a4975", "#4a2750", "#25102c"],
  },
  sepia: {
    paper: "#f7f2ea", ink: "#231a10", muted: "#7b6d5c", line: "#e9dfcf", heart: "#d6452f",
    tones: ["#f7f2ea", "#efdfc6", "#ddbb8d", "#bb8a55", "#8a5a2e", "#5a3518", "#2f1a0b"],
  },
  night: {
    paper: "#08100c", ink: "#e2eee7", muted: "#7d9286", line: "#18271f", heart: "#ff6369",
    tones: ["#08100c", "#0c1c14", "#123224", "#1a4b33", "#256a48", "#3a8c63", "#62b388"],
  },
  karakoram: {
    paper: "#0d1524", ink: "#eaf0f8", muted: "#8797ae", line: "#1c2940", heart: "#ff6369",
    tones: ["#0d1524", "#1b2a43", "#334a6c", "#5d7599", "#97abc7", "#d3deec", "#fafcff"],
  },
};

const SANS_STACK = '"Inter", "Inter Variable", "Geist", "Helvetica Neue", Arial, system-ui, sans-serif';
const MONO_STACK = '"JetBrains Mono", "Geist Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace';

/* ═════════════════════════════════════════════════════════════════
   Pure helpers (noise, dither, palette) — as in the component
   ═════════════════════════════════════════════════════════════════ */
// #region ridge

/** Hex → [r, g, b] in 0–255, or null for anything that isn't #rgb / #rrggbb. */
function rdfHex(hex) {
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec((hex || "").trim());
  if (!m) return null;
  const h = m[1].length === 3 ? m[1].split("").map((c) => c + c).join("") : m[1];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}

/** [r, g, b] → one opaque pixel for a little-endian Uint32 view of ImageData. */
function rdfPack(rgb) {
  return ((255 << 24) | (rgb[2] << 16) | (rgb[1] << 8) | rgb[0]) >>> 0;
}

/** The classic 8×8 Bayer matrix, as thresholds in (0, 1). */
const RDF_BAYER = [
  0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
  12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
  3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
  15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21,
].map((v) => (v + 0.5) / 64);

/** Palette index for a tone in [0, 1] across `n` colours at Bayer threshold `b`. */
function rdfDither(tone, n, b) {
  const t = tone < 0 ? 0 : tone > 1 ? 1 : tone;
  const v = Math.floor(t * (n - 1) + b);
  return v > n - 1 ? n - 1 : v;
}

/** Integer lattice hash → [0, 1). */
function rdfHash(x, y, seed) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/** Smooth value noise in [0, 1). */
function rdfNoise(x, y, seed) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = rdfHash(xi, yi, seed);
  const b = rdfHash(xi + 1, yi, seed);
  const c = rdfHash(xi, yi + 1, seed);
  const d = rdfHash(xi + 1, yi + 1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/** Fractal value noise, normalised back into [0, 1). */
function rdfFbm(x, y, seed, octaves) {
  let sum = 0;
  let amp = 0.5;
  let norm = 0;
  for (let o = 0; o < octaves; o++) {
    sum += rdfNoise(x, y, seed + o * 31) * amp;
    norm += amp;
    x *= 2.03;
    y *= 2.03;
    amp *= 0.5;
  }
  return norm > 0 ? sum / norm : 0;
}

/** Hermite step from e0 to e1, clamped. */
function rdfSmooth(e0, e1, x) {
  const t = e1 === e0 ? (x < e0 ? 0 : 1) : Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

/** Ease-out cubic over a progress that may run outside [0, 1]. */
function rdfEase(t) {
  const c = t < 0 ? 0 : t > 1 ? 1 : t;
  return 1 - Math.pow(1 - c, 3);
}

/* ═════════════════════════════════════════════════════════════════
   The mountains of Pakistan
   ═════════════════════════════════════════════════════════════════ */

/**
 * Six of Pakistan's great peaks, ordered west → east by longitude. `u` is the
 * schematic position across the footer (0–1): the order is real, the spacing
 * is evened out. `wl`/`wr` are the half-widths of the massif to the left and
 * right of the summit (shares of the footer), `exp` how straight its faces
 * are (lower = broader, more domed) and `sh` its shoulders and sub-summits
 * (`du` offset from the summit, `h` height as a share of the summit's, `w`
 * half-width). `elev` is the summit height in metres. `depth` is how many
 * ranges back from the nearest one the peak stands. Only peaks with a `name`
 * get a permanent label; the rest simply give the skyline its shape.
 */
const RDF_PEAKS = [
  { elev: 7708, u: 0.045, wl: 0.07, wr: 0.13, exp: 1.25, sh: [], depth: 5 },
  // Rakaposhi: a long, sweeping ridge that climbs to one summit and falls away steeply.
  { name: "Rakaposhi", elev: 7788, place: "Nagar, Gilgit-Baltistan", u: 0.19, wl: 0.15, wr: 0.20, exp: 1.2,
    sh: [{ du: 0.075, h: 0.72, w: 0.07 }, { du: -0.085, h: 0.56, w: 0.07 }, { du: 0.16, h: 0.4, w: 0.06 }], depth: 4 },
  // Nanga Parbat: a vast, broad massif whose wall steps along several summits.
  { name: "Nanga Parbat", elev: 8126, place: "Diamer, Gilgit-Baltistan", u: 0.385, wl: 0.19, wr: 0.18, exp: 1.05,
    sh: [{ du: -0.085, h: 0.8, w: 0.075 }, { du: 0.09, h: 0.84, w: 0.08 }, { du: 0.165, h: 0.58, w: 0.07 }], depth: 3 },
  { elev: 7821, u: 0.54, wl: 0.10, wr: 0.11, exp: 1.2, sh: [{ du: 0.06, h: 0.6, w: 0.05 }], depth: 5 },
  // K2: a great pyramid with steep, straight faces and a lower shoulder beside it.
  { name: "K2", elev: 8611, place: "Baltoro Karakoram, Gilgit-Baltistan", u: 0.705, wl: 0.20, wr: 0.23, exp: 1.4,
    sh: [{ du: -0.105, h: 0.62, w: 0.075 }, { du: 0.135, h: 0.5, w: 0.08 }], depth: 4 },
  { elev: 8080, u: 0.915, wl: 0.12, wr: 0.08, exp: 1.2, sh: [{ du: -0.06, h: 0.55, w: 0.05 }], depth: 5 },
];

/** 8126 → "8,126 m" */
function rdfMetres(n) {
  return Math.round(n).toLocaleString("en-US");
}

/**
 * Crest row of ridge `i` of `layers` (0 is the farthest) for every column of
 * a `cols` × `rows` grid, plus `margin` columns either side for parallax.
 * Farther ridges sit higher with more, smaller peaks; nearer ones are lower,
 * broader and taller. (The component's own generator, unchanged.)
 */
function rdfRidgeline(cols, rows, i, layers, seed, margin) {
  const k = layers > 1 ? i / (layers - 1) : 1;
  const n = cols + margin * 2;
  const out = new Float32Array(n);
  const base = rows * (0.38 + 0.66 * Math.pow(k, 1.4));
  const amp = rows * (0.2 + 0.24 * k);
  const freq = 6 - 3.8 * k;
  // Near ridges climb toward both edges, one side more than the other, so the
  // range opens into a valley. Nothing climbs into the faded band at the top.
  const flankL = rows * 0.5 * k * k * k * (0.55 + 0.6 * rdfHash(i, 11, seed));
  const flankR = rows * 0.5 * k * k * k * (0.55 + 0.6 * rdfHash(i, 13, seed));
  const ceil = rows * 0.17;
  const tilt = (rdfHash(i, 7, seed) - 0.5) * rows * 0.34 * (0.4 + k);
  const s = (seed | 0) * 13 + i * 101;
  for (let x = 0; x < n; x++) {
    const u = (x - margin) / cols;
    const r1 = 1 - Math.abs(rdfNoise(u * freq + i * 3.7, 0.5, s) * 2 - 1);
    const r2 = 1 - Math.abs(rdfNoise(u * freq * 2.3, 3.5, s + 1) * 2 - 1);
    const f = rdfFbm(u * freq * 4.1, 9.5, s + 2, 3);
    const h = r1 * r1 * 0.62 + r2 * 0.24 + f * 0.14;
    const e = Math.min(1.2, Math.abs(u * 2 - 1));
    const y = base - h * amp + tilt * (u - 0.5) * 2 - (u < 0.5 ? flankL : flankR) * e * e * Math.sqrt(e);
    out[x] = y < ceil ? ceil - (ceil - y) * 0.25 : y;
  }
  return out;
}

/**
 * Raise one massif out of a ridge so its apex stands exactly at `apexRow`.
 * The faces run down in straight-ish flanks that are broader on one side,
 * sub-summits and shoulders step along the way, and ridged noise carves the
 * crest into crags. Everything blends into the ridge, so it reads as part of
 * the range rather than something stood on top of it.
 */
function rdfRaise(t, cols, margin, peak, apexRow, seed) {
  const c = Math.round(peak.u * cols);
  const wl = Math.max(6, peak.wl * cols);
  const wr = Math.max(6, peak.wr * cols);
  const sd = (seed | 0) + c;
  const sh = peak.sh || [];
  for (let x = 0; x < t.length; x++) {
    const cx = x - margin;
    const d = Math.abs(cx - c) / (cx < c ? wl : wr);
    let H = d < 1 ? Math.pow(1 - d, peak.exp) : 0;
    for (let j = 0; j < sh.length; j++) {
      const q = sh[j];
      const dj = Math.abs(cx - (c + q.du * cols)) / Math.max(4, q.w * cols);
      if (dj < 1) {
        // Sub-summits only stand proud of the main face; they never overtop it.
        const v = q.h * Math.pow(1 - dj, 1.3);
        if (v > H) H = v;
      }
    }
    if (H <= 0 || t[x] <= apexRow) continue;
    // Ridged noise carves crags, strongest mid-face, nil at the foot and at the apex.
    const r = 1 - Math.abs(rdfNoise(cx * 0.16, 1.7, sd) * 2 - 1);
    const r2 = 1 - Math.abs(rdfNoise(cx * 0.45, 4.3, sd + 3) * 2 - 1);
    const crag = (r * 0.65 + r2 * 0.35 - 0.5) * 30 * H * (1 - H) * 2;
    t[x] = Math.max(apexRow, t[x] - (t[x] - apexRow) * H + crag);
  }
}

  brandHref: "#",

  tagline: undefined,    // undefined shows the default line; "" hides it
  columns: DEFAULT_COLUMNS,
  socials: DEFAULT_SOCIALS,
  preset: "auto",
  palette: null,
  seed: 7,
  ridges: 6,
  pixel: 2,
  mist: 0.8,
  drift: 1,

  monoFamily: MONO_STACK,
  height: "720px",
  sceneMinHeight: "420px",

};

function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function resolvePalette(cfg, dark) {
  const base = cfg.preset === "auto" ? (dark ? PRESETS.night : PRESETS.evergreen) : PRESETS[cfg.preset] || PRESETS.evergreen;
  const colors = Object.assign({}, base, cfg.palette || {});
  const tones = colors.tones && colors.tones.length >= 2 ? colors.tones : base.tones;
  return {
    colors,
    tones,
    deep: tones[Math.max(1, tones.length - 2)],
    accent: tones[Math.max(1, tones.length - 3)],
  };
}

function footerMarkup(cfg) {
  const logo = cfg.logo != null ? cfg.logo : RIDGE_MARK;
  const tagline =
    cfg.tagline === ""
      ? ""
      : `<p class="rdf-tag rdf-r" style="--d:230">${esc(
          cfg.tagline != null ? cfg.tagline : `Join thousands of teams already using ${cfg.name} to simplify the way they work.`
        )}</p>`;
  const socials = cfg.socials.length
    ? `<ul class="rdf-social">${cfg.socials
        .map(
          (s, i) =>
            `<li class="rdf-r" style="--d:${320 + i * 60}"><a href="${esc(s.href || "#")}" aria-label="${esc(
              s.label || SOCIAL_NAMES[s.icon]
            )}">${SOCIAL_ICONS[s.icon] || ""}</a></li>`
        )
        .join("")}</ul>`
    : "";
  const columns = cfg.columns
    .map(
      (col, ci) => `
        <nav class="rdf-col" aria-label="${esc(col.title)}">
          <h3 class="rdf-r" style="--d:${260 + ci * 110}">${esc(col.title)}</h3>
          <ul>${col.links
            .map(
              (l, li) =>
                `<li class="rdf-r" style="--d:${330 + ci * 110 + li * 55}">${
                  l.href
                    ? `<a class="rdf-link" href="${esc(l.href)}">${esc(l.label)}${l.badge ? `<span class="rdf-badge">${esc(l.badge)}</span>` : ""}</a>`
                    : `<button type="button" class="rdf-copy" data-copy="${esc(l.copy || l.label)}" aria-label="Copy ${esc(l.label)}">${esc(l.label)}${COPY_ICON}</button>`
                }</li>`
            )
            .join("")}</ul>
        </nav>`
    )
    .join("");
  const peaks = cfg.peaks
    .filter((q) => q.name)
    .map(
      (q) =>
        `<li class="rdf-peak"><i class="rdf-peak-dot"></i><b class="rdf-peak-line"></b>` +
        `<span class="rdf-peak-label"><strong>${esc(q.name)}, ${rdfMetres(q.elev)} m</strong><small>${esc(q.place)}</small></span></li>`
    )
    .join("");

  return `
    <div class="rdf-frame">
      <div class="rdf-top">
        <div class="rdf-brand">
          <a class="rdf-logo rdf-r" style="--d:140" href="${esc(cfg.brandHref)}">${logo}<span>${esc(cfg.name)}</span></a>
          ${tagline}
          ${socials}
        </div>
        ${columns}
      </div>
      <div class="rdf-scene">
        <canvas aria-hidden="true"></canvas>
        <ul class="rdf-peaks" aria-label="Peaks of Pakistan">${peaks}</ul>
        <div class="rdf-alt" aria-hidden="true"><b></b><i></i><span></span></div>
      </div>
    </div>`;
}

/* ═════════════════════════════════════════════════════════════════
   The footer
   ═════════════════════════════════════════════════════════════════ */
function mountRidgelineFooter(host, options) {
  const cfg = Object.assign({}, DEFAULTS, options || {});
  const layers = Math.max(2, Math.min(9, Math.round(cfg.ridges)));
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const footer = document.createElement("footer");
  footer.className = "rdf-root" + (cfg.className ? " " + cfg.className : "");
  footer.innerHTML = footerMarkup(cfg);
  host.appendChild(footer);

  // When the reveal began (performance.now()), shared by the CSS and the canvas
  // so a re-layout never replays it. null until the footer is first seen.
  let revealAt = null;

  function isDark() {
    return document.documentElement.classList.contains("dark") || !!footer.closest(".dark");
  }

  let dark = isDark();
  let theme = resolvePalette(cfg, dark);

  function applyPalette() {
    const { colors, deep, accent } = theme;
    const s = footer.style;
    s.minHeight = cfg.height;
    s.setProperty("--rdf-scene-min", cfg.sceneMinHeight);
    s.setProperty("--rdf-paper", colors.paper);
    s.setProperty("--rdf-ink", colors.ink);
    s.setProperty("--rdf-muted", colors.muted);
    s.setProperty("--rdf-line", colors.line);
    s.setProperty("--rdf-heart", colors.heart);
    s.setProperty("--rdf-deep", deep);
    s.setProperty("--rdf-accent", accent);
    s.setProperty("--rdf-n", String(cfg.columns.length));
    s.setProperty("--rdf-max", cfg.maxWidth);
    s.setProperty("--rdf-sans", cfg.fontFamily);
    s.setProperty("--rdf-mono", cfg.monoFamily);
  }

  // The canvas renderer. Returns a stop function.
  function startCanvas() {
    const scene = footer.querySelector(".rdf-scene");
    const canvas = scene.querySelector("canvas");
    const alt = scene.querySelector(".rdf-alt");
    const altText = alt.querySelector("span");
    const ctx = canvas.getContext("2d");
    if (!ctx) return () => {};

    const tones = theme.tones;
    const pal = new Uint32Array(tones.map((t) => rdfPack(rdfHex(t) || [128, 128, 128])));
    const nTones = pal.length;
    const seed = cfg.seed;
    const named = cfg.peaks.filter((q) => q.name); // the labelled summits

    const labels = Array.from(footer.querySelectorAll(".rdf-peak")).map((el) => ({
      el,
      box: el.querySelector(".rdf-peak-label"),
      w: 0, h: 0,
      len: 12,   // leader length in px
      bl: 0,     // label's left edge relative to its leader, in px
    }));

    let p = 2;
    let cols = 1;
    let rows = 1;
    let margin = 2;
    let sceneW = 1;
    let sceneH = 1;
    let offY = 0;
    let img = null;
    let buf = new Uint32Array(0);
    let tops = [];
    // Per layer, how deep the valley mist reaches under the crest, along its length.
    let pools = [];
    // Per frame, per layer per column: crest row and slope.
    let colTop = new Float32Array(0);
    let colSlope = new Float32Array(0);
    let colPool = new Float32Array(0);
    let colSnow = new Float32Array(0);
    let colAt = new Int32Array(0);
    let fog = new Float32Array(0);
    let fw = 1;
    let fh = 1;
    let fadeTo = 1;
    // Where each named summit sits on the grid (column, crest row).
    let peakCol = [];
    let peakRow = [];
    let peakLayer = [];
    // Grid row → metres (the inverse of the skyline's height scale), and the altimeter's state.
    let elevOf = (row) => row;
    let altShown = false;
    let altLabel = "";
    let altFlip = false;
    const shifts = new Float32Array(layers);
    const rises = new Float32Array(layers);

    let raf = 0;
    let visible = true;
    let awake = true;
    let stopped = false;
    let lastDraw = 0;
    let lastTick = performance.now();
    // Pointer, in grid cells: target and eased.
    let tx = 0;
    let ty = 0;
    let ex = 0;
    let ey = 0;
    let inside = false;
    let clear = 0;
    // Parallax in -1..1, target and eased.
    let pt = 0;
    let pe = 0;
    let windV = 0;
    let windX = 0;

    // Stack the labels: the highest summits claim the tier nearest their crest,
    // and each label climbs a tier until it no longer touches another label or leader.
    const placeLabels = () => {
      const MIN_Y = 48;
      const hit = (a, b, pad) => a.x0 < b.x1 + pad && a.x1 > b.x0 - pad && a.y0 < b.y1 + pad && a.y1 > b.y0 - pad;
      labels.forEach((lab) => {
        lab.w = lab.box.offsetWidth;
        lab.h = lab.box.offsetHeight;
      });
      const order = labels.map((_, j) => j).sort((a, b) => peakRow[a] - peakRow[b]);
      const placed = [];
      order.forEach((j) => {
        const lab = labels[j];
        const ax = (peakCol[j] + 0.5) * p;
        const ay = peakRow[j] * p + offY;
        const left = Math.min(Math.max(ax - lab.w / 2, 8), Math.max(8, sceneW - 8 - lab.w));
        const step = lab.h + 8;
        let best = null;
        for (let t = 0; t < 8; t++) {
          const len = 12 + t * step;
          const rect = { x0: left, x1: left + lab.w, y0: ay - len - 6 - lab.h, y1: ay - len - 6 };
          if (rect.y0 < MIN_Y && best) break;
          const leader = { x0: ax - 1, x1: ax + 1, y0: rect.y1, y1: ay };
          let hits = 0;
          for (let q = 0; q < placed.length; q++) {
            if (hit(rect, placed[q].rect, 6)) hits++;
            if (hit(rect, placed[q].leader, 4)) hits++;
            if (hit(leader, placed[q].rect, 4)) hits++;
          }
          if (!best || hits < best.hits) best = { len, rect, leader, hits };
          if (hits === 0) break;
        }
        placed.push(best);
        lab.len = best.len;
        lab.bl = best.rect.x0 - ax;
        lab.el.style.setProperty("--len", best.len.toFixed(1) + "px");
      });
    };

    const layout = () => {
      const rect = scene.getBoundingClientRect();
      sceneW = rect.width;
      sceneH = rect.height;
      p = Math.max(1, Math.round(cfg.pixel));
      cols = Math.max(8, Math.ceil(rect.width / p));
      rows = Math.max(8, Math.ceil(rect.height / p));
      canvas.width = cols;
      canvas.height = rows;
      canvas.style.width = cols * p + "px";
      canvas.style.height = rows * p + "px";
      // The canvas is bottom-aligned, so its top may poke above the scene by under one pixel cell.
      offY = sceneH - rows * p;
      img = ctx.createImageData(cols, rows);
      buf = new Uint32Array(img.data.buffer);
      margin = Math.ceil(cols * 0.045) + 3;

      // Metres → grid row. The tallest summit sits `headroom` px down from the top,
      // leaving room above every crest for its label.
      const headRows = Math.max(40 / p, cfg.headroom / p);
      const baseRows = rows - 18 / p;
      const E0 = 1500;
      const E1 = Math.max.apply(null, cfg.peaks.map((q) => q.elev));
      const yOf = (E) => baseRows - ((E - E0) / (E1 - E0)) * (baseRows - headRows);
      elevOf = (row) => E0 + ((baseRows - row) / (baseRows - headRows)) * (E1 - E0);
      const lowRow = headRows + (baseRows - headRows) * 0.3; // highest the ordinary ridges may climb
      const peakLayerOf = (q) => Math.max(0, Math.min(layers - 1, layers - 1 - q.depth));
      fadeTo = Math.max(4, Math.min(Math.max(rows * 0.3, 128 / p), headRows * 0.8));

      tops = [];
      pools = [];
      for (let i = 0; i < layers; i++) {
        const t = rdfRidgeline(cols, rows, i, layers, seed, margin);
        // Squeeze the rolling ranges below the great peaks, then raise each massif to its true height.
        for (let x = 0; x < t.length; x++) t[x] = lowRow + (t[x] - rows * 0.17) * ((rows - lowRow) / (rows * 0.83));
        cfg.peaks.forEach((q) => {
          if (peakLayerOf(q) === i) rdfRaise(t, cols, margin, q, yOf(q.elev), seed);
        });
        const pool = new Float32Array(t.length);
        for (let x = 0; x < t.length; x++) pool[x] = 0.45 + 1.1 * rdfFbm(((x - margin) / cols) * 4, i * 5.3, seed + 9, 2);
        tops.push(t);
        pools.push(pool);
      }
      colTop = new Float32Array(layers * cols);
      colSlope = new Float32Array(layers * cols);
      colPool = new Float32Array(layers * cols);
      colSnow = new Float32Array(layers * cols);
      colAt = new Int32Array(layers * cols);
      fw = (cols >> 1) + 2;
      fh = (rows >> 1) + 2;
      fog = new Float32Array(fw * fh);

      // Anchor every label to the exact crest of its summit.
      peakCol = named.map((q) => Math.round(q.u * cols));
      peakLayer = named.map(peakLayerOf);
      peakRow = peakCol.map((c, j) => tops[peakLayer[j]][c + margin]);
      placeLabels();
      awake = true;
    };

    const draw = (now) => {
      if (!img) return;
      const dt = Math.min(64, now - lastTick);
      lastTick = now;
      const live = cfg.interactive && !reduced;
      const age = revealAt === null ? -1 : now - revealAt;

      // Ease the pointer, the clearing and the parallax toward their targets.
      const ease = 1 - Math.pow(0.82, dt / 16.7);
      const slow = 1 - Math.pow(0.93, dt / 16.7);
      ex += (tx - ex) * ease;
      ey += (ty - ey) * ease;
      clear += ((inside && cfg.interactive ? 1 : 0) - clear) * slow;
      pe += ((live ? pt : 0) - pe) * slow;
      windV *= Math.pow(0.965, dt / 16.7);
      windX += (windV * dt) / 1000;
      const fogT = (reduced ? 0 : (now / 1000) * 0.045 * Math.max(0, cfg.drift)) + windX;

      // The mist: a wide, slow fractal field at half resolution.
      const sx = 9 / cols;
      const sy = 4.4 / rows;
      for (let gy = 0; gy < fh; gy++) {
        const ny = gy * sy;
        for (let gx = 0; gx < fw; gx++) {
          const nx = gx * sx + fogT;
          const warp = rdfNoise(nx * 0.45 - fogT * 0.6, ny * 0.8, 77) * 0.6;
          const v = rdfFbm(nx + warp, ny + warp * 0.4, 31, 3);
          fog[gy * fw + gx] = rdfSmooth(0.3, 0.74, v);
        }
      }

      // Each ridge's reveal, back to front, and where its crest sits this frame.
      const rev = new Float32Array(layers);
      const k = new Float32Array(layers);
      const toneBase = new Float32Array(layers);
      const fogDepth = new Float32Array(layers);
      for (let i = 0; i < layers; i++) {
        k[i] = i / (layers - 1);
        rev[i] = age < 0 ? 0 : rdfEase((age - 380 - i * 170) / 1300);
        toneBase[i] = 0.16 + 0.76 * Math.pow(k[i], 1.6);
        fogDepth[i] = rows * (0.08 + 0.42 * k[i]);
        const rise = (1 - rev[i]) * rows * 0.09;
        const shift = Math.round(pe * (0.25 + k[i]) * 0.75 * (margin - 3));
        rises[i] = rise;
        shifts[i] = shift;
        const t = tops[i];
        const last = t.length - 1;
        for (let x = 0; x < cols; x++) {
          const at = x + margin + shift;
          colTop[i * cols + x] = t[at] + rise;
          colSlope[i * cols + x] = t[Math.min(last, at + 2)] - t[Math.max(0, at - 2)];
          colPool[i * cols + x] = fogDepth[i] * pools[i][at];
          // Snow settles on whatever stands above the snowline.
          colAt[i * cols + x] = at;
          colSnow[i * cols + x] = rdfSmooth(3600, 6800, elevOf(t[at]));
        }
      }
      const lift = age < 0 ? 1 : 1 - rdfEase((age - 900) / 1800);
      const mistK = Math.max(0, Math.min(1, cfg.mist));
      const r = Math.max(1, cfg.radius / p);
      const r2 = r * r;

      for (let y = 0; y < rows; y++) {
        const fade = rdfSmooth(0, fadeTo, y);
        const frow = (y >> 1) * fw;
        const by = (y & 7) * 8;
        const dyc = (y - ey) * 1.5;
        for (let x = 0; x < cols; x++) {
          let L = -1;
          for (let i = layers - 1; i >= 0; i--) {
            if (y >= colTop[i * cols + x]) {
              L = i;
              break;
            }
          }
          let tone = 0;
          let mk = 0.3;
          if (L >= 0) {
            const kk = k[L];
            const d = y - colTop[L * cols + x];
            const depth = colPool[L * cols + x];
            const crest = 1 - rdfSmooth(0, depth, d) * (0.88 - 0.45 * kk);
            tone = toneBase[L] * crest;
            const sl = colSlope[L * cols + x] * (0.06 + 0.04 * colSnow[L * cols + x]);
            tone += (sl < -0.2 ? -0.2 : sl > 0.2 ? 0.2 : sl) * (1 - rdfSmooth(0, depth * 0.5, d));
            tone += (rdfHash(x + Math.round(colTop[L * cols + x] * 7), d | 0, L) - 0.5) * 0.07 * kk;
            // Fresh snow on the upper slopes, fading with depth below the crest.
            const sn = colSnow[L * cols + x];
            tone += sn * (0.34 + 0.5 * kk) * (1 - rdfSmooth(0, depth * 1.25, d));
            // Gullies and ridges running down the faces, lit on one side and shaded on the other.
            if (sn > 0.02) {
              const g = rdfNoise(colAt[L * cols + x] * 0.32, d * 0.05 + L * 7.1, 91) - 0.5;
              tone += g * 0.4 * sn * (0.45 + 0.55 * kk) * rdfSmooth(0, 14, d);
            }
            tone *= rev[L];
            mk = (0.95 - 0.5 * kk) * (1 - 0.5 * sn);
          } else {
            tone = 0.05 * rdfSmooth(rows * 0.15, rows * 0.6, y);
          }

          let m = fog[frow + (x >> 1)] * mistK * mk;
          if (clear > 0.01) {
            const dx = x - ex;
            const q = (dx * dx + dyc * dyc) / r2;
            if (q < 4) {
              const c = clear * Math.exp(-q);
              m *= 1 - c * 0.92;
              if (L >= 0) tone += c * 0.16 * rev[L];
            }
          }
          // Just under full tone, so even the deepest slope keeps its texture.
          if (tone > 0.93) tone = 0.93;
          m += lift * 0.55;
          if (m > 1) m = 1;
          tone = (tone * (1 - m) + 0.09 * m * (1 - lift)) * fade;

          buf[y * cols + x] = pal[rdfDither(tone, nTones, RDF_BAYER[by + (x & 7)])];
        }
      }
      ctx.putImageData(img, 0, 0);

      // The peak labels ride the crest of their summit, rising and fading in
      // with its range, and drifting with its parallax. Always visible.
      for (let j = 0; j < labels.length; j++) {
        const lab = labels[j];
        const lay = peakLayer[j];
        const axPx = (peakCol[j] + 0.5 - shifts[lay]) * p;
        const ayPx = (peakRow[j] + rises[lay]) * p + offY;
        const left = Math.min(Math.max(axPx + lab.bl, 4), Math.max(4, sceneW - 4 - lab.w));
        lab.el.style.transform = "translate(" + axPx.toFixed(1) + "px," + ayPx.toFixed(1) + "px)";
        lab.box.style.transform = "translateX(" + (left - axPx).toFixed(1) + "px)";
        lab.el.style.opacity = rdfSmooth(0.35, 1, rev[lay]).toFixed(3);
        // Where it sits now, so the altimeter can keep clear of it.
        const bottom = ayPx - lab.len - 6;
        lab.rect = { x0: left, x1: left + lab.w, y0: bottom - lab.h, y1: bottom, ax: axPx, ay: ayPx };
      }

      // The altimeter rides the crest of the ridge under the pointer and reads its true height.
      let show = false;
      if (cfg.altimeter && inside && age > 1600) {
        let x = Math.max(0, Math.min(cols - 1, Math.round(ex)));
        for (let i = layers - 1; i >= 0; i--) {
          // Close to a labelled summit, snap to its apex so the read-out matches its label.
          for (let j = 0; j < peakLayer.length; j++) {
            const ax = peakCol[j] - shifts[i];
            if (peakLayer[j] === i && Math.abs(x - ax) <= 3 && ax >= 0 && ax < cols) {
              x = ax;
              break;
            }
          }
          const crest = colTop[i * cols + x];
          if (ey >= crest - 6) {
            show = true;
            const axp = x * p;
            const ayp = crest * p + offY;
            alt.style.transform = "translate(" + axp.toFixed(1) + "px," + ayp.toFixed(1) + "px)";
            const text = Math.max(900, Math.round(elevOf(crest - rises[i]))).toLocaleString("en-US") + " m";
            if (text !== altLabel) {
              altLabel = text;
              altText.textContent = text;
            }
            // The read-out normally sits above the crest. If that would touch a peak label, drop it below instead.
            const tip = { x0: axp - 40, x1: axp + 40, y0: ayp - 62, y1: ayp };
            let flip = tip.y0 < 2;
            for (let j = 0; j < labels.length && !flip; j++) {
              const r = labels[j].rect;
              if (!r) continue;
              const box = r.x0 - 8 < tip.x1 && r.x1 + 8 > tip.x0 && r.y0 - 8 < tip.y1 && r.y1 + 8 > tip.y0;
              const lead = r.ax + 2 > tip.x0 && r.ax - 2 < tip.x1 && r.y1 < tip.y1 && r.ay > tip.y0;
              if (box || lead) flip = true;
            }
            if (flip !== altFlip) {
              altFlip = flip;
              alt.classList.toggle("rdf-below", flip);
            }
            break;
          }
        }
      }
      if (show !== altShown) {
        altShown = show;
        alt.style.opacity = show ? "1" : "0";
      }

      const settling =
        Math.abs(tx - ex) + Math.abs(ty - ey) > 0.05 ||
        Math.abs((inside && cfg.interactive ? 1 : 0) - clear) > 0.005 ||
        Math.abs((live ? pt : 0) - pe) > 0.001 ||
        Math.abs(windV) > 0.002;
      awake = (age >= 0 && age < 3400) || age < 0 || settling || (!reduced && cfg.drift > 0);
    };

    const busy = () => {
      const age = revealAt === null ? -1 : performance.now() - revealAt;
      return (age >= 0 && age < 3400) || inside || Math.abs(windV) > 0.002 || Math.abs(pt - pe) > 0.001;
    };

    const loop = (now) => {
      raf = 0;
      if (!visible || stopped) return;
      // Nothing to show until the reveal starts; just wait for it.
      if (revealAt === null) {
        raf = requestAnimationFrame(loop);
        return;
      }
      // Full rate while revealing or under the pointer; the idle drift is slow
      // enough that every other frame reads the same.
      if (busy() || now - lastDraw > 32) {
        draw(now);
        lastDraw = now;
      }
      if (awake) raf = requestAnimationFrame(loop);
    };

    const wake = () => {
      awake = true;
      if (!raf && visible && !stopped) raf = requestAnimationFrame(loop);
    };

    const onMove = (e) => {
      if (!cfg.interactive && !cfg.altimeter) return;
      const b = footer.getBoundingClientRect();
      pt = b.width > 0 ? ((e.clientX - b.left) / b.width) * 2 - 1 : 0;
      const s = scene.getBoundingClientRect();
      const lx = (e.clientX - s.left) / p;
      const ly = (e.clientY - s.top) / p;
      const was = inside;
      inside = lx >= 0 && ly >= 0 && lx < cols && ly < rows;
      tx = lx;
      ty = ly;
      if (inside && !was) {
        ex = tx;
        ey = ty;
      }
      wake();
    };

    const onLeave = () => {
      pt = 0;
      inside = false;
      wake();
    };

    const onDown = (e) => {
      if (!cfg.interactive || reduced || !inside) return;
      if (e.target.closest && e.target.closest("a,button")) return;
      // A gust blows the mist away from whichever side was clicked.
      windV += tx < cols / 2 ? 1.4 : -1.4;
      wake();
    };

    layout();
    draw(performance.now());
    wake();

    // Label sizes depend on the webfont, so lay them out again once it has loaded.
    const relabel = () => {
      if (stopped) return;
      placeLabels();
      draw(performance.now());
      wake();
    };
    if (document.fonts) {
      if (document.fonts.ready) document.fonts.ready.then(relabel);
      if (document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", relabel);
    }

    footer.addEventListener("pointermove", onMove);
    footer.addEventListener("pointerleave", onLeave);
    footer.addEventListener("pointerdown", onDown);
    const ro = new ResizeObserver(() => {
      layout();
      draw(performance.now());
      wake();
    });
    ro.observe(scene);
    const io = new IntersectionObserver((entries) => {
      visible = entries[0] ? entries[0].isIntersecting : true;
      if (visible) {
        lastTick = performance.now();
        wake();
      }
    });
    io.observe(footer);

    return () => {
      stopped = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      io.disconnect();
      if (document.fonts && document.fonts.removeEventListener) document.fonts.removeEventListener("loadingdone", relabel);
      footer.removeEventListener("pointermove", onMove);
      footer.removeEventListener("pointerleave", onLeave);
      footer.removeEventListener("pointerdown", onDown);
    };
  }

  // The reveal starts once, the first time a fifth of the footer is on screen.
  const revealObserver = new IntersectionObserver(
    (entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      if (revealAt === null) revealAt = reduced ? -Infinity : performance.now();
      footer.classList.add("rdf-in");
      revealObserver.disconnect();
    },
    { threshold: 0.2 }
  );
  revealObserver.observe(footer);

  // "auto" follows a .dark class on the page.
  const themeObserver = new MutationObserver(() => {
    if (cfg.preset !== "auto") return;
    const next = isDark();
    if (next === dark) return;
    dark = next;
    theme = resolvePalette(cfg, dark);
    applyPalette();
    stopCanvas();
    stopCanvas = startCanvas();
  });
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

  // Click a handle to copy it.
  const onCopy = (e) => {
    const btn = e.target.closest && e.target.closest(".rdf-copy");
    if (!btn) return;
    const text = btn.getAttribute("data-copy") || "";
    const done = () => {
      btn.classList.add("rdf-done");
      setTimeout(() => btn.classList.remove("rdf-done"), 1400);
    };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (err) {}
      ta.remove();
      done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  };
  footer.addEventListener("click", onCopy);

  applyPalette();
  let stopCanvas = startCanvas();

  return {
    element: footer,
    destroy() {
      revealObserver.disconnect();
      themeObserver.disconnect();
      stopCanvas();
      footer.removeEventListener("click", onCopy);
      footer.remove();
    },
  };
}

window.RidgelineDitherFooter = { mount: mountRidgelineFooter, PRESETS, PEAKS: RDF_PEAKS, defaults: DEFAULTS };

/* ── Usage.tsx (DemoGlacier) ─────────────────────────────────── */
window.ridgelineFooter = window.RidgelineDitherFooter.mount(document.getElementById("footer-host"), {
  preset: "karakoram",
  seed: 23,
  ridges: 7,
  name: "ib_hussain",
  brandHref: "https://ib-hussain.github.io",
  tagline: "",
  columns: [
    {
      title: "Elsewhere",
      links: [
        { label: "github.com/ib-hussain", href: "https://github.com/ib-hussain" },
        { label: "linkedin.com/in/ib-hussain", href: "https://linkedin.com/in/ib-hussain" },
        { label: "ib-hussain.github.io", href: "https://ib-hussain.github.io" },
      ],
    },
    { title: "Handles", links: [{ label: "ib_hussain" }, { label: "ib-hussain" }, { label: "ib_hussain@archlinux" }] }, // click to copy
  ],
  socials: [],
});
// The logo doubles as the tab icon.
const icon = document.createElement("link");
icon.rel = "icon";
icon.href = LOGO_SRC;
document.head.appendChild(icon);
document.body.style.background = window.RidgelineDitherFooter.PRESETS.karakoram.paper;
</script>
