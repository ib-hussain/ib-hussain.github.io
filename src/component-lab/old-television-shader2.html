<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Old Television Shader</title>
<style>
:root{--background:#ffffff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--background:#0a0a0a;color-scheme:dark}}
:root[data-theme="dark"]{--background:#0a0a0a;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--background)}
.shader{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--background)}
.grain{position:absolute;inset:0;opacity:.2;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");background-size:256px 256px}
.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;text-align:center;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#71717a}
.fallback.on{display:flex}
</style>
</head>
<body>
<div class="shader" id="root">
  <div class="grain" aria-hidden="true"></div>
  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <p class="fallback" id="fallback" role="status">WebGL is not available in this browser, so the shader can't be drawn.</p>
</div>

<script>
"use strict";

// Port of WaveShaderMaterial + PolishedShader. Raw WebGL1, no libraries.
// The camera matches the original: position z = 2, fov 75. The plane is 4 x 4
// units at z = 0, so its clip-space scale comes from the half-height at that depth.

const VERT = `
attribute vec2 aPos;
uniform vec2 uScale;
varying vec2 vUv;
varying vec3 vPosition;
void main() {
  vUv = aPos / 4.0 + 0.5;
  vPosition = vec3(aPos, 0.0);
  gl_Position = vec4(aPos * uScale, 0.0, 1.0);
}
`;

const FRAG = `
precision highp float;
uniform float uTime;
uniform vec3 uColorA;
uniform vec3 uColorB;
uniform vec2 uMouse;
uniform vec2 uResolution;
varying vec2 vUv;
varying vec3 vPosition;

float noise(vec2 st) {
  return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
}

// Fractal noise for more complex texture
float fbm(vec2 st) {
  float value = 0.0;
  float amplitude = 0.5;
  for (int i = 0; i < 4; i++) {
    value += amplitude * noise(st);
    st *= 2.0;
    amplitude *= 0.5;
  }
  return value;
}

// Smooth interpolation
float smoothNoise(vec2 st) {
  vec2 i = floor(st);
  vec2 f = fract(st);
  float a = noise(i);
  float b = noise(i + vec2(1.0, 0.0));
  float c = noise(i + vec2(0.0, 1.0));
  float d = noise(i + vec2(1.0, 1.0));
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}

void main() {
  vec2 st = vUv;

  // Create flowing waves
  float wave1 = sin(st.x * 8.0 + uTime * 2.0) * 0.1;
  float wave2 = sin(st.y * 6.0 + uTime * 1.5) * 0.1;
  float wave3 = sin((st.x + st.y) * 4.0 + uTime * 3.0) * 0.05;

  // Mouse interaction
  vec2 mouseInfluence = (uMouse - 0.5) * 0.3;
  st += mouseInfluence;

  float waves = wave1 + wave2 + wave3;

  float noiseValue = smoothNoise(st * 3.0 + uTime * 0.5);
  float fbmNoise = fbm(st * 2.0 + uTime * 0.3);
  float combinedNoise = mix(noiseValue, fbmNoise, 0.6);

  // Mix colors based on waves and noise
  float mixFactor = (waves + combinedNoise + 1.0) * 0.5;
  mixFactor = smoothstep(0.2, 0.8, mixFactor);

  vec3 color = mix(uColorA, uColorB, mixFactor);

  float glow = 1.0 - distance(st, vec2(0.5)) * 1.2;
  glow = smoothstep(0.0, 1.0, glow);
  glow += combinedNoise * 0.2;

  color += glow * 0.15;

  // Time-based brightness variation
  float brightness = 0.9 + sin(uTime * 0.8) * 0.1;
  color *= brightness;

  gl_FragColor = vec4(color, 1.0);
}
`;

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { alpha: true, antialias: true, premultipliedAlpha: true });

if (!gl) {
  canvas.style.display = "none";
  document.getElementById("fallback").classList.add("on");
} else {
  start(gl);
}

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

function start(gl) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  // Two triangles covering the 4 x 4 plane (world units, centred on the origin).
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -2, -2, 2, -2, -2, 2,
    -2, 2, 2, -2, 2, 2,
  ]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uniform = (name) => gl.getUniformLocation(program, name);
  const uScale = uniform("uScale");
  const uTime = uniform("uTime");
  const uColorA = uniform("uColorA");
  const uColorB = uniform("uColorB");
  const uMouseLoc = uniform("uMouse");
  const uResolution = uniform("uResolution");

  gl.uniform3f(uColorA, 1, 1, 1);  // #ffffff
  gl.uniform3f(uColorB, 0, 0, 0);  // #000000

  // Camera: fov 75 at distance 2 gives a half-height of 2 * tan(37.5deg) at z = 0.
  const HALF_HEIGHT = 2 * Math.tan((75 * Math.PI) / 360);
  let aspect = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || 1;
    const h = canvas.clientHeight || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    aspect = w / h;
    gl.uniform2f(uScale, 1 / (HALF_HEIGHT * aspect), 1 / HALF_HEIGHT);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // Mouse, in 0..1 with y up, lerped toward the pointer each frame.
  const target = { x: 0, y: 0 };
  const smooth = { x: 0, y: 0 };
  window.addEventListener("mousemove", (e) => {
    target.x = e.clientX / window.innerWidth;
    target.y = 1 - e.clientY / window.innerHeight;
  });

  const t0 = performance.now();
  function frame(now) {
    smooth.x += (target.x - smooth.x) * 0.05;
    smooth.y += (target.y - smooth.y) * 0.05;
    gl.uniform1f(uTime, (now - t0) / 1000);
    gl.uniform2f(uMouseLoc, smooth.x, smooth.y);
    gl.uniform2f(uResolution, window.innerWidth, window.innerHeight);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
