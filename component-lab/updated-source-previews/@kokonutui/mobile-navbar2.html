<!DOCTYPE html>
<html lang="en">
<head>

<title>Account Menu</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #fafafa; color: #18181b; min-height: 100vh;
  transition: background-color .3s ease, color .3s ease;
}
html.dark body { background: #09090b; color: #f4f4f5; }

/* ---- Demo chrome (not part of the component) ---- */
.demo-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  height: 52px; padding: 0 20px; font-size: 13px;
}
.demo-bar button {
  font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid currentColor; background: transparent; color: inherit; opacity: .8;
}
.demo-bar button:hover { opacity: 1; }
.demo-bar button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.demo-stage { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 56px 16px 48px; min-height: calc(100vh - 52px); }
.demo-log { margin: 0; font-size: 12px; opacity: .6; min-height: 1em; }

/* ---- Component styles, mapped from its Tailwind classes ---- */
.am-root { position: relative; display: inline-block; isolation: isolate; }
.am-root.open { z-index: 50; }

.am-trigger {
  display: flex; align-items: center; gap: 10px; width: 15rem; padding: 8px 12px 8px 8px;
  border: 1px solid #e4e4e7; border-radius: 1rem; background: #ffffff; color: inherit; font: inherit;
  text-align: left; cursor: pointer; outline: none;
  transition: border-color .15s ease-out, background-color .15s ease-out;
}
.am-trigger:hover { border-color: #d4d4d8; background: #fafafa; }
.am-trigger:focus-visible { box-shadow: 0 0 0 2px #fafafa, 0 0 0 4px #a1a1aa; }
html.dark .am-trigger { border-color: #27272a; background: #18181b; }
html.dark .am-trigger:hover { border-color: #3f3f46; background: rgb(39 39 42 / .6); }
html.dark .am-trigger:focus-visible { box-shadow: 0 0 0 2px #09090b, 0 0 0 4px #71717a; }
.am-trigger-id { flex: 1; min-width: 0; }
.am-chev { flex-shrink: 0; width: 1rem; height: 1rem; color: #a1a1aa; transition: opacity .15s ease-out; }
html.dark .am-chev { color: #71717a; }
.am-root.open .am-chev { opacity: 0; }

.am-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.am-id.stacked { flex-direction: column; align-items: flex-start; gap: 12px; }
.am-texts { display: flex; flex-direction: column; min-width: 0; text-align: left; }
.am-name {
  position: relative; z-index: 20; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: .875rem; font-weight: 500; line-height: 1.25rem; color: #18181b;
}
.am-email {
  position: relative; z-index: 20; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: .75rem; line-height: 1rem; color: #71717a;
}
html.dark .am-name { color: #f4f4f5; }
html.dark .am-email { color: #a1a1aa; }
.am-av {
  position: relative; z-index: 20; flex-shrink: 0; display: grid; place-items: center; user-select: none;
  width: 2rem; height: 2rem; border-radius: 9999px; font-size: 11px; font-weight: 500; letter-spacing: .025em;
}
.am-av.lg { width: 2.5rem; height: 2.5rem; }
.am-av.md { width: 1.75rem; height: 1.75rem; }
.am-av.xs { width: 1.25rem; height: 1.25rem; font-size: 7px; letter-spacing: 0; box-shadow: 0 0 0 2px #ffffff; }
html.dark .am-av.xs { box-shadow: 0 0 0 2px #09090b; }
.am-av.tone0 { background: #18181b; color: #ffffff; }
.am-av.tone1 { background: #e4e4e7; color: #3f3f46; }
.am-av.tone2 { background: #f4f4f5; color: #71717a; box-shadow: inset 0 0 0 1px #e4e4e7; }
html.dark .am-av.tone0 { background: #f4f4f5; color: #18181b; }
html.dark .am-av.tone1 { background: #3f3f46; color: #f4f4f5; }
html.dark .am-av.tone2 { background: #27272a; color: #d4d4d8; box-shadow: inset 0 0 0 1px #3f3f46; }
.am-dot {
  position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; border-radius: 9999px;
  box-shadow: 0 0 0 2px #ffffff; transition: background-color .2s ease-out;
}
html.dark .am-dot { box-shadow: 0 0 0 2px #18181b; }
.am-av.xs .am-dot { display: none; }
.s-online { background: #10b981; } .s-away { background: #fbbf24; } .s-busy { background: #ef4444; }
.invisible { visibility: hidden; }

/* The panel: two surface layers and the content, all clipped to the animated box. */
.am-panel { position: absolute; top: 0; right: 0; z-index: 10; width: 288px; pointer-events: none; }
.am-panel[hidden] { display: none; }
.am-surface { position: absolute; inset: 0; filter: drop-shadow(0 12px 24px rgb(0 0 0 / .08)) drop-shadow(0 2px 4px rgb(0 0 0 / .04)); }
html.dark .am-surface { filter: drop-shadow(0 12px 28px rgb(0 0 0 / .5)); }
.am-outer, .am-innerbg { position: absolute; inset: 0; }
.am-outer { background: #e4e4e7; }
.am-innerbg { background: #ffffff; }
html.dark .am-outer { background: #27272a; }
html.dark .am-innerbg { background: #18181b; }
.am-clip { position: relative; }
.am-panel.live .am-clip { pointer-events: auto; }
.am-track { display: flex; width: max-content; align-items: flex-start; will-change: transform; }
.am-page { flex-shrink: 0; width: 288px; padding: 6px; transition: opacity .3s cubic-bezier(.23, 1, .32, 1); }
.am-page.off { opacity: 0; }
.am-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 10px 10px 12px; }
.am-plan { flex-shrink: 0; padding-top: 2px; font-size: .75rem; color: #a1a1aa; }
html.dark .am-plan { color: #71717a; }
.am-menu { outline: none; }
.am-fs { display: flex; align-items: center; justify-content: space-between; min-width: 0; margin: 0; padding: 4px 4px 4px 10px; border: 0; }
.am-fs-label { font-size: .875rem; color: #71717a; }
html.dark .am-fs-label { color: #a1a1aa; }
.am-status-row { display: flex; }
.am-status-btn {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 0; border-radius: .5rem;
  background: transparent; color: #71717a; font: inherit; font-size: .75rem; cursor: pointer; outline: none;
  transition: background-color .1s ease-out, color .1s ease-out;
}
.am-status-btn[aria-checked="true"] { color: #18181b; }
.am-status-btn:focus { background: #f4f4f5; }
html.dark .am-status-btn { color: #a1a1aa; }
html.dark .am-status-btn[aria-checked="true"] { color: #fafafa; }
html.dark .am-status-btn:focus { background: #27272a; }
.am-status-dot { width: 8px; height: 8px; border-radius: 9999px; background: #d4d4d8; transition: background-color .2s ease-out; }
.am-status-dot.on.s-online { background: #10b981; }
.am-status-dot.on.s-away { background: #fbbf24; }
.am-status-dot.on.s-busy { background: #ef4444; }
html.dark .am-status-dot { background: #52525b; }
.am-themes { position: relative; display: flex; padding: 2px; border-radius: 10px; background: #f4f4f5; }
html.dark .am-themes { background: #27272a; }
.am-theme-btn {
  position: relative; display: grid; place-items: center; width: 36px; height: 28px; border: 0; border-radius: .5rem;
  background: transparent; color: #71717a; cursor: pointer; outline: none; transition: color .15s ease-out;
}
.am-theme-btn:hover { color: #27272a; }
.am-theme-btn[aria-checked="true"] { color: #18181b; }
.am-theme-btn:focus-visible { box-shadow: 0 0 0 2px #a1a1aa; }
.am-theme-btn svg { position: relative; width: 14px; height: 14px; }
html.dark .am-theme-btn { color: #a1a1aa; }
html.dark .am-theme-btn:hover { color: #e4e4e7; }
html.dark .am-theme-btn[aria-checked="true"] { color: #fafafa; }
.am-theme-ind {
  position: absolute; border-radius: .5rem; background: #ffffff; box-shadow: 0 1px 2px rgb(0 0 0 / .08);
  pointer-events: none; transition: left .25s cubic-bezier(.2, .8, .2, 1), width .25s cubic-bezier(.2, .8, .2, 1);
}
html.dark .am-theme-ind { background: #3f3f46; }
.am-hr { height: 1px; margin: 6px 10px; border: 0; background: #f4f4f5; }
html.dark .am-hr { background: #18181b; }

.am-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px;
  background: transparent; color: #3f3f46; font: inherit; font-size: .875rem; line-height: 1.25rem; text-align: left;
  text-decoration: none; cursor: default; outline: none; transition: background-color .1s ease-out, color .1s ease-out;
}
.am-item:focus { background: #f4f4f5; color: #09090b; }
html.dark .am-item { color: #d4d4d8; }
html.dark .am-item:focus { background: #27272a; color: #fafafa; }
.am-item .ico { display: inline-flex; flex-shrink: 0; color: #a1a1aa; }
.am-item .ico svg { width: 16px; height: 16px; }
html.dark .am-item .ico { color: #71717a; }
.am-item .lbl { flex: 1; min-width: 0; }
.am-item .val { font-size: .75rem; color: #a1a1aa; }
html.dark .am-item .val { color: #71717a; }
.am-item.hold { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
.am-hold-label { display: flex; align-items: center; gap: 10px; width: 100%; }
.am-hold-label .hint { font-size: .75rem; opacity: .6; }
.am-hold-fill {
  position: absolute; inset: 0; display: flex; align-items: center; gap: 10px; padding: 0 10px;
  border-radius: 10px; background: #18181b; color: #fafafa; pointer-events: none;
  clip-path: inset(0 100% 0 0 round 10px); transition: clip-path 240ms cubic-bezier(.23, 1, .32, 1);
}
html.dark .am-hold-fill { background: #f4f4f5; color: #18181b; }
.am-hold-fill .ico { color: inherit; }
.am-item.hold .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.am-back { gap: 6px; padding-left: 6px; font-weight: 500; }
.am-back svg { flex-shrink: 0; width: 16px; height: 16px; color: #a1a1aa; }
.am-back .ico { color: #a1a1aa; }
.am-acct .nm { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.am-acct .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.am-acct .n1 { color: #18181b; }
.am-acct .n2 { font-size: .75rem; color: #71717a; }
html.dark .am-acct .n1 { color: #f4f4f5; }
html.dark .am-acct .n2 { color: #a1a1aa; }
.am-acct .ck { color: #18181b; flex-shrink: 0; }
.am-acct .ck svg { width: 16px; height: 16px; }
html.dark .am-acct .ck { color: #f4f4f5; }
.am-add .plus {
  display: grid; place-items: center; width: 28px; height: 28px; border: 1px dashed #d4d4d8; border-radius: 9999px; color: #a1a1aa;
}
.am-add .plus svg { width: 14px; height: 14px; }
html.dark .am-add .plus { border-color: #3f3f46; color: #71717a; }
.am-stack { display: flex; }
.am-chev-right { width: 16px; height: 16px; margin-left: auto; color: #a1a1aa; }
html.dark .am-chev-right { color: #71717a; }
.am-item.switch .am-stack { margin-right: 2px; }
.am-stack > .am-av + .am-av { margin-left: -6px; }

.am-page-accounts-body { transition: opacity .3s cubic-bezier(.23, 1, .32, 1); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { .am-page, .am-theme-ind, .am-hold-fill { transition: none !important; } }
</style>

<body>
<div class="demo-bar">
  <span>Account menu</span>
  <button type="button" id="toggle-dark" aria-pressed="false">Dark mode</button>
</div>
<div class="demo-stage">
  <div id="menu-host"></div>
  <p class="demo-log" id="log" aria-live="polite"></p>
</div>

<script>
(() => {
"use strict";

/* ---- Pure data, status and keyboard helpers, transpiled from the component source ---- */
const SAMPLE_ACCOUNTS = [
    { id: "personal", name: "Maya Ortega", email: "maya@ortega.me", plan: "Pro" },
    {
        id: "studio",
        name: "Fieldwork Studio",
        email: "team@fieldwork.studio",
        plan: "Team",
    },
    {
        id: "side",
        name: "Night Shift",
        email: "hello@nightshift.dev",
        plan: "Free",
    },
];
const STATUSES = [
    { id: "online", label: "Online", name: "Online", dot: "bg-emerald-500" },
    { id: "away", label: "Away", name: "Away", dot: "bg-amber-400" },
    { id: "busy", label: "DND", name: "Do not disturb", dot: "bg-red-500" },
];
const WHITESPACE = /\s+/;
const PANEL_W = 288;
const RADIUS = 16;
const SPRING = { type: "spring", duration: 0.3, bounce: 0 };
const INDICATOR_SPRING = {
    type: "spring",
    duration: 0.25,
    bounce: 0,
};
const INSTANT = { duration: 0 };
const EASE_OUT = [0.23, 1, 0.32, 1];
const NAV_KEYS = new Set([
    "ArrowDown",
    "ArrowUp",
    "ArrowLeft",
    "ArrowRight",
    "Home",
    "End",
]);
function initialsOf(account) {
    if (account.initials) {
        return account.initials;
    }
    return account.name
        .split(WHITESPACE)
        .slice(0, 2)
        .map((part) => part[0] ?? "")
        .join("")
        .toUpperCase();
}
function viaOf(event) {
    // A click fired by Enter or Space carries no pointer detail.
    return event.detail === 0 ? "keyboard" : "pointer";
}
function menuItems(root) {
    if (!root) {
        return [];
    }
    return Array.from(root.querySelectorAll("[data-menu-item]"));
}
function sideTarget(items, current, step) {
    const row = items.filter((item) => item.dataset.row === current.dataset.row);
    if (row.length < 2) {
        return;
    }
    const index = row.indexOf(current);
    return row[(index + step + row.length) % row.length];
}
function rowTarget(items, current, step) {
    const rows = [...new Set(items.map((item) => item.dataset.row))];
    const index = rows.indexOf(current.dataset.row);
    const next = rows[(index + step + rows.length) % rows.length];
    const candidates = items.filter((item) => item.dataset.row === next);
    return (candidates.find((item) => item.getAttribute("aria-checked") === "true") ??
        candidates[0]);
}
/** Where arrow keys move focus: rows go up and down, radios left and right. */
function nextTarget(items, active, key) {
    if (key === "Home") {
        return items[0];
    }
    if (key === "End") {
        return items.at(-1);
    }
    const current = items.find((item) => item === active);
    if (!current) {
        return key === "ArrowUp" ? items.at(-1) : items[0];
    }
    if (key === "ArrowLeft" || key === "ArrowRight") {
        return sideTarget(items, current, key === "ArrowRight" ? 1 : -1);
    }
    return rowTarget(items, current, key === "ArrowDown" ? 1 : -1);
}


/* Icons from the component (lucide), as SVG path data. */
const ICON = {
  "chevrons-up-down": '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/>',
  settings: '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  "credit-card": '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  "log-out": '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  "chevron-left": '<path d="m15 18-6-6 6-6"/>',
  "chevron-right": '<path d="m9 18 6-6-6-6"/>',
  plus: '<path d="M5 12h14M12 5v14"/>',
};
const svg = (name, cls = "") =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

const THEME_LIST = [
  { id: "light", label: "Light", icon: "sun" },
  { id: "dark", label: "Dark", icon: "moon" },
  { id: "system", label: "System", icon: "monitor" },
];
const SAMPLE_ITEMS_DEF = [
  { label: "Profile", icon: "user" },
  { label: "Settings", icon: "settings", value: "⌘," },
  { label: "Billing", icon: "credit-card" },
];
const TONE_CLASS = ["tone0", "tone1", "tone2"];
const SPRING_STIFFNESS = (2 * Math.PI / 0.3) ** 2; // duration .3, bounce 0: critically damped
const SPRING_DAMPING = 2 * Math.sqrt(SPRING_STIFFNESS);
const reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
let uidCount = 0;
const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const statusOf = (id) => STATUSES.find((s) => s.id === id);
const dotOf = (id) => (id ? `s-${id}` : "");

/* One clock for every spring, stepped at a fixed rate like the component's motion values. */
function makeClock() {
  const springs = new Set();
  let raf = 0;
  let last = 0;
  let carry = 0;
  const STEP = 1 / 120;
  const frame = (now) => {
    raf = 0;
    // Follow wall-clock time: a slow frame should not slow the spring down.
    const dt = last ? Math.min((now - last) / 1000, 0.25) : STEP;
    last = now;
    carry += dt;
    while (carry >= STEP) {
      carry -= STEP;
      for (const sp of springs) {
        const acc = -SPRING_STIFFNESS * (sp.v - sp.target) - SPRING_DAMPING * sp.vel;
        sp.vel += acc * STEP;
        sp.v += sp.vel * STEP;
      }
    }
    for (const sp of [...springs]) {
      sp.onUpdate?.(sp.v);
      if (Math.abs(sp.v - sp.target) < 0.05 && Math.abs(sp.vel) < 0.5) {
        sp.v = sp.target;
        sp.vel = 0;
        springs.delete(sp);
        const done = sp.onDone;
        sp.onDone = null;
        done?.();
      }
    }
    if (springs.size) raf = requestAnimationFrame(frame);
    else last = 0;
  };
  const wake = () => {
    if (!raf) raf = requestAnimationFrame(frame);
  };
  return {
    spring(initial, onUpdate) {
      return { v: initial, vel: 0, target: initial, onUpdate, onDone: null, at: "rest" };
    },
    to(sp, target, onDone = null) {
      sp.target = target;
      sp.onDone = onDone;
      if (!springs.has(sp)) springs.add(sp);
      wake();
    },
    jump(sp, value) {
      sp.v = value;
      sp.vel = 0;
      sp.target = value;
      sp.onDone = null;
      springs.delete(sp);
    },
    stop(sp) {
      sp.onDone = null;
      springs.delete(sp);
    },
  };
}

/* A simple tween for opacity, with an optional delay (the component's ease-out). */
function tween(from, to, duration, delay, onUpdate) {
  const EASE = (t) => 1 - (1 - t) ** 3;
  let raf = 0;
  let start = 0;
  const frame = (now) => {
    if (!start) start = now;
    const t = Math.min(1, Math.max(0, (now - start - delay) / duration));
    onUpdate(from + (to - from) * EASE(t));
    if (t < 1) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}

/* The panel, its header and menu, and its sharing of identity between the trigger and the header. */
function mountAccountMenu(host, options) {
  const P = Object.assign(
    {
      accounts: SAMPLE_ACCOUNTS,
      defaultAccountId: undefined,
      items: SAMPLE_ITEMS_DEF,
      theme: undefined,
      defaultTheme: "system",
      status: undefined,
      defaultStatus: "online",
      holdDuration: 1200,
      onAccountChange: null,
      onAddAccount: null,
      onThemeChange: null,
      onStatusChange: null,
      onSignOut: null,
    },
    window.AccountMenuConfig || {},
    options || {}
  );
  const uid = ++uidCount;
  const menuId = `am-menu-${uid}`;
  const PANEL_W_PX = PANEL_W;

  let accountId = P.defaultAccountId ?? P.accounts[0]?.id;
  let theme = P.theme ?? P.defaultTheme;
  let status = P.status ?? P.defaultStatus;
  let phase = "closed";
  let page = "main";
  let instant = false;
  let closeSeq = 0;
  let pageFocus = null;
  let openIntent = { focus: "menu", resume: false };
  let targetH = 0;
  let opacityStop = () => {};
  const clock = makeClock();
  const w = clock.spring(0, paintClip);
  const h = clock.spring(0, paintClip);
  const pageX = clock.spring(0, paintPage);

  host.innerHTML =
    '<div class="am-root">' +
    '<button class="am-trigger" type="button" aria-haspopup="menu" aria-expanded="false">' +
    '<span class="am-trigger-id"></span>' +
    svg("chevrons-up-down", "am-chev") +
    "</button>" +
    '<div class="am-panel" hidden>' +
    '<div class="am-surface" aria-hidden="true"><div class="am-outer"></div><div class="am-innerbg"></div></div>' +
    '<div class="am-clip"><div class="am-track">' +
    '<div class="am-page" data-page="main"><div class="am-header"><span class="am-panel-id"></span><span class="am-plan"></span></div>' +
    `<div class="am-menu" id="${menuId}" role="menu" tabindex="-1"></div></div>` +
    '<div class="am-page am-page-accounts" data-page="accounts" inert><div class="am-accounts" role="menu" tabindex="-1" aria-label="Switch account"></div></div>' +
    "</div></div></div></div>";

  const root = host.querySelector(".am-root");
  const trigger = root.querySelector(".am-trigger");
  const triggerIdHost = root.querySelector(".am-trigger-id");
  const panel = root.querySelector(".am-panel");
  const panelIdHost = root.querySelector(".am-panel-id");
  const outerEl = root.querySelector(".am-outer");
  const innerEl = root.querySelector(".am-innerbg");
  const clipEl = root.querySelector(".am-clip");
  const track = root.querySelector(".am-track");
  const mainPage = root.querySelector('[data-page="main"]');
  const accountsPage = root.querySelector('[data-page="accounts"]');
  const menuEl = root.querySelector(".am-menu");
  const accountsEl = root.querySelector(".am-accounts");
  const planEl = root.querySelector(".am-plan");
  const bodyEls = () => [menuEl, accountsEl, planEl];
  let bodyOpacity = 1;
  const paintOpacity = () => bodyEls().forEach((el) => { el.style.opacity = String(bodyOpacity); });

  const pageEl = (target) => (target === "main" ? mainPage : accountsPage);
  const account = () => P.accounts.find((a) => a.id === accountId) ?? P.accounts[0] ?? { id: "guest", name: "Guest", email: "" };
  const toneOf = (acct) => Math.max(0, P.accounts.indexOf(acct));

  /* Identity: avatar, name and email, shared between the trigger and the header. */
  const identityHTML = (stacked, acct) => {
    const dot = dotOf(status);
    const size = stacked ? "lg" : "";
    return (
      `<span class="am-id${stacked ? " stacked" : ""}">` +
      `<span class="am-av ${size} ${TONE_CLASS[toneOf(acct) % 3]}" data-el="avatar" aria-hidden="true">${esc(initialsFor(acct))}` +
      (dot ? `<span class="am-dot ${dot}"></span>` : "") +
      "</span>" +
      '<span class="am-texts">' +
      `<span class="am-name" data-el="name">${esc(acct.name)}</span>` +
      `<span class="am-email" data-el="email">${esc(acct.email)}</span>` +
      "</span></span>"
    );
  };
  const initialsFor = (acct) => initialsOf(acct);
  const renderIdentity = () => {
    const acct = account();
    triggerIdHost.innerHTML = identityHTML(false, acct);
    panelIdHost.innerHTML = identityHTML(true, acct);
    root.querySelector(".am-plan").textContent = acct.plan ?? "";
    if (switchBtn) {
      const others = P.accounts.filter((a) => a.id !== acct.id);
      switchBtn.innerHTML =
        '<span class="am-stack">' +
        others.slice(0, 2).map((e) => `<span class="am-av xs ${TONE_CLASS[toneOf(e) % 3]}" aria-hidden="true">${esc(initialsOf(e))}</span>`).join("") +
        '</span><span class="lbl">Switch account</span>' + svg("chevron-right", "am-chev-right");
    }
    root.querySelector(".am-plan").style.display = acct.plan ? "" : "none";
    paintOpacity();
    renderAccounts();
  };
  const idEls = (where) => {
    const scope = where === "trigger" ? triggerIdHost : panelIdHost;
    return {
      avatar: scope.querySelector('[data-el="avatar"]'),
      name: scope.querySelector('[data-el="name"]'),
      email: scope.querySelector('[data-el="email"]'),
    };
  };
  const rectsOf = (els) => {
    const out = {};
    for (const key of Object.keys(els)) out[key] = els[key].getBoundingClientRect();
    return out;
  };
  /* Shared layout: the elements travel from where they were to where they are now. */
  const flip = (from, els) => {
    if (reduceQuery.matches) return;
    for (const key of Object.keys(els)) {
      const f = from[key];
      if (!f) continue;
      const t = els[key].getBoundingClientRect();
      if (!t.width || !f.width) continue;
      const dx = f.left - t.left;
      const dy = f.top - t.top;
      const sx = f.width / t.width;
      const sy = f.height / t.height;
      els[key].animate(
        [
          { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, transformOrigin: "top left" },
          { transform: "translate(0px, 0px) scale(1, 1)", transformOrigin: "top left" },
        ],
        { duration: 300, easing: "cubic-bezier(.2, .8, .2, 1)" }
      );
    }
  };

  function paintClip() {
    const W = w.v;
    const H = h.v;
    const outer = `inset(0px 0px calc(100% - ${H}px) calc(100% - ${W}px) round 16px)`;
    const inner = `inset(1px 1px calc(100% - ${H}px + 1px) calc(100% - ${W}px + 1px) round 15px)`;
    outerEl.style.clipPath = outer;
    innerEl.style.clipPath = inner;
    clipEl.style.clipPath = inner;
  }
  function paintPage() {
    track.style.transform = `translate3d(${pageX.v}px, 0, 0)`;
  }

  /* Shows which page is live: the other one is faded and inert. */
  const showPage = (target) => {
    page = target;
    mainPage.classList.toggle("off", target !== "main");
    accountsPage.classList.toggle("off", target !== "accounts");
    mainPage.inert = target !== "main";
    accountsPage.inert = target !== "accounts";
  };

  const reflectPhase = () => {
    const open = phase === "open";
    root.classList.toggle("open", phase !== "closed");
    panel.classList.toggle("live", open);
    panel.hidden = phase === "closed";
    trigger.setAttribute("aria-expanded", String(open));
    if (open) trigger.setAttribute("aria-controls", menuId);
    else trigger.removeAttribute("aria-controls");
    triggerIdHost.classList.toggle("invisible", open);
    panelIdHost.classList.toggle("invisible", !open);
  };

  /* Morph the panel open from the trigger. A keyboard open skips to the end. */
  const openMenu = (via, focus) => {
    if (phase === "open") return;
    const resume = phase === "closing";
    openIntent = { focus, resume };
    closeSeq++;
    instant = via === "keyboard" || reduceQuery.matches;
    const before = rectsOf(idEls("trigger"));
    showPage("main");
    resetHold();
    phase = "open";
    reflectPhase();
    placeThemeIndicator(true);
    flip(before, idEls("panel"));
    const triggerEl = trigger;
    const main = mainPage;
    clock.jump(pageX, 0);
    targetH = main.offsetHeight;
    opacityStop();
    if (instant) {
      clock.jump(w, PANEL_W_PX);
      clock.jump(h, targetH);
      bodyOpacity = 1;
    } else {
      if (!resume) {
        clock.jump(w, triggerEl.offsetWidth);
        clock.jump(h, triggerEl.offsetHeight);
        bodyOpacity = 0;
      }
      clock.to(w, PANEL_W_PX);
      clock.to(h, targetH);
      opacityStop = tween(bodyOpacity, 1, 200, 50, (v) => { bodyOpacity = v; paintOpacity(); });
    }
    paintOpacity();
    paintClip();
    paintPage();
    const list = menuItems(main);
    const targets = {
      first: list[0],
      last: list.at(-1),
      menu: main.querySelector("[role=menu]"),
    };
    targets[openIntent.focus]?.focus({ preventScroll: true });
  };

  const closeMenu = (via, returnFocus) => {
    if (phase !== "open") return;
    if (returnFocus) trigger.focus({ preventScroll: true });
    if (via === "keyboard" || reduceQuery.matches) {
      instant = true;
      opacityStop();
      finishClose();
      return;
    }
    instant = false;
    const before = rectsOf(idEls("panel"));
    phase = "closing";
    reflectPhase();
    flip(before, idEls("trigger"));
    const seq = ++closeSeq;
    opacityStop();
    opacityStop = tween(bodyOpacity, 0, 120, 0, (v) => { bodyOpacity = v; paintOpacity(); });
    clock.to(w, trigger.offsetWidth);
    clock.to(h, trigger.offsetHeight, () => {
      if (closeSeq === seq) finishClose();
    });
  };
  function finishClose() {
    phase = "closed";
    reflectPhase();
  }

  const goTo = (target) => {
    pageFocus = target === "accounts" ? "first" : "switch";
    showPage(target);
    if (phase !== "open") return;
    const el = pageEl(target);
    const x = target === "main" ? 0 : -PANEL_W_PX;
    targetH = el.offsetHeight;
    if (reduceQuery.matches) {
      clock.jump(pageX, x);
      clock.jump(h, targetH);
    } else {
      clock.to(pageX, x);
      clock.to(h, targetH);
    }
    const intent = pageFocus;
    pageFocus = null;
    if (intent === "first") {
      const list = menuItems(el);
      const checked = list.find((item) => item.getAttribute("aria-checked") === "true");
      (checked ?? list[0])?.focus({ preventScroll: true });
    } else if (intent === "switch") {
      el.querySelector("[data-switch]")?.focus({ preventScroll: true });
    }
  };

  const select = (event, run) => {
    run?.();
    closeMenu(viaOf(event), true);
  };

  /* Status and theme rows. */
  const statusRowHTML = () =>
    '<fieldset class="am-fs am-status-row-wrap" aria-label="Status"><span class="am-fs-label">Status</span><span class="am-status-row">' +
    STATUSES.map(
      (entry) =>
        `<button type="button" class="am-status-btn" role="menuitemradio" tabindex="-1" data-menu-item="" data-row="status" data-id="${entry.id}" aria-label="${esc(entry.name)}" aria-checked="false">` +
        `<span class="am-status-dot s-${entry.id}"></span>${esc(entry.label)}</button>`
    ).join("") +
    "</span></fieldset>";
  const themeRowHTML = () =>
    '<fieldset class="am-fs" aria-label="Theme"><span class="am-fs-label">Theme</span><span class="am-themes">' +
    '<span class="am-theme-ind" aria-hidden="true"></span>' +
    THEME_LIST.map(
      (entry) =>
        `<button type="button" class="am-theme-btn" role="menuitemradio" tabindex="-1" data-menu-item="" data-row="theme" data-id="${entry.id}" aria-label="${entry.label}" aria-checked="false">${svg(entry.icon)}</button>`
    ).join("") +
    "</span></fieldset>";

  const itemHTML = (item, index) => {
    const inner =
      `<span class="ico">${item.icon ? svg(item.icon) : ""}</span>` +
      `<span class="lbl">${esc(item.label)}</span>` +
      (item.value ? `<span class="val">${esc(item.value)}</span>` : "");
    const attrs = `class="am-item" data-menu-item="" data-row="item-${index}" role="menuitem" tabindex="-1"`;
    if (item.href) {
      return `<a ${attrs} href="${esc(item.href)}"${item.external ? ' target="_blank" rel="noopener noreferrer"' : ""}>${inner}</a>`;
    }
    return `<button type="button" ${attrs}>${inner}</button>`;
  };

  const holdHTML = () =>
    '<button type="button" class="am-item hold" data-menu-item="" data-row="sign-out" role="menuitem" tabindex="-1">' +
    '<span class="am-hold-label"><span class="ico">' + svg("log-out") + '</span><span class="lbl">Sign out</span><span class="hint hold-hint">Hold</span></span>' +
    '<span class="sr-only">, press and hold to confirm</span>' +
    '<span class="am-hold-fill" aria-hidden="true"><span class="ico">' + svg("log-out") + '</span><span class="lbl">Sign out</span><span class="hint hold-hint">Hold</span></span>' +
    "</button>";

  menuEl.innerHTML =
    statusRowHTML() +
    themeRowHTML() +
    '<hr class="am-hr">' +
    P.items.map(itemHTML).join("") +
    (P.accounts.length > 1
      ? '<button type="button" class="am-item switch" data-menu-item="" data-row="switch" data-switch="" role="menuitem" tabindex="-1" aria-haspopup="menu" aria-expanded="false"></button>'
      : "") +
    '<hr class="am-hr">' +
    holdHTML();

  const statusBtns = Array.from(menuEl.querySelectorAll('[data-row="status"]'));
  const themeBtns = Array.from(menuEl.querySelectorAll('[data-row="theme"]'));
  const themeInd = menuEl.querySelector(".am-theme-ind");
  const themesBox = menuEl.querySelector(".am-themes");
  const switchBtn = menuEl.querySelector("[data-switch]");
  const holdBtn = menuEl.querySelector('[data-row="sign-out"]');
  const holdLabels = Array.from(holdBtn.querySelectorAll(".hold-hint"));
  const holdFill = holdBtn.querySelector(".am-hold-fill");

  const paintRows = () => {
    statusBtns.forEach((btn) => {
      const checked = btn.dataset.id === status;
      btn.setAttribute("aria-checked", String(checked));
      btn.querySelector(".am-status-dot").classList.toggle("on", checked);
    });
    themeBtns.forEach((btn) => {
      btn.setAttribute("aria-checked", String(btn.dataset.id === theme));
    });
    placeThemeIndicator(false);
  };
  const placeThemeIndicator = (instantMove) => {
    const btn = themeBtns.find((b) => b.dataset.id === theme);
    if (!btn) return;
    if (instantMove) themeInd.style.transition = "none";
    themeInd.style.left = `${btn.offsetLeft}px`;
    themeInd.style.top = `${btn.offsetTop}px`;
    themeInd.style.width = `${btn.offsetWidth}px`;
    themeInd.style.height = `${btn.offsetHeight}px`;
    if (instantMove) {
      void themeInd.offsetWidth;
      themeInd.style.transition = "";
    }
  };
  const setStatus = (id) => {
    if (status === id) return;
    status = id;
    P.onStatusChange?.(id);
    renderIdentity();
    paintRows();
  };
  const setTheme = (id) => {
    if (theme === id) return;
    theme = id;
    P.onThemeChange?.(id);
    paintRows();
  };

  statusBtns.forEach((btn) => btn.addEventListener("click", () => setStatus(btn.dataset.id)));
  themeBtns.forEach((btn) => btn.addEventListener("click", () => setTheme(btn.dataset.id)));
  menuEl.querySelectorAll("[data-menu-item]").forEach((el) => {
    if (el.dataset.row?.startsWith("item-")) {
      const index = Number(el.dataset.row.slice(5));
      el.addEventListener("click", (event) => select(event, P.items[index]?.onSelect));
    }
  });
  switchBtn?.addEventListener("click", () => goTo("accounts"));

  /* Hold to sign out: a fill runs across the row while the button is held. */
  let holdTimer;
  let nudgeTimer;
  let holding = false;
  let done = false;
  let nudge = false;
  const paintHold = () => {
    holdFill.style.clipPath = holding || done ? "inset(0 0 0 0 round 10px)" : "inset(0 100% 0 0 round 10px)";
    holdFill.style.transition = holding ? `clip-path ${P.holdDuration}ms linear` : "clip-path 240ms cubic-bezier(0.23, 1, 0.32, 1)";
    holdLabels.forEach((el) => { el.textContent = nudge ? "Keep holding" : "Hold"; });
  };
  function resetHold() {
    clearTimeout(holdTimer);
    clearTimeout(nudgeTimer);
    holdTimer = undefined;
    holding = false;
    done = false;
    nudge = false;
    paintHold();
  }
  const startHold = (via) => {
    if (holdTimer !== undefined || done) return;
    clearTimeout(nudgeTimer);
    nudge = false;
    holding = true;
    paintHold();
    holdTimer = setTimeout(() => {
      holdTimer = undefined;
      holding = false;
      done = true;
      paintHold();
      P.onSignOut?.();
      closeMenu(via, true);
    }, P.holdDuration);
  };
  const cancelHold = () => {
    if (holdTimer === undefined) return;
    clearTimeout(holdTimer);
    holdTimer = undefined;
    holding = false;
    nudge = true;
    paintHold();
    nudgeTimer = setTimeout(() => { nudge = false; paintHold(); }, 1400);
  };
  holdBtn.addEventListener("blur", cancelHold);
  holdBtn.addEventListener("click", (event) => event.preventDefault());
  holdBtn.addEventListener("contextmenu", (event) => event.preventDefault());
  holdBtn.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      if (!event.repeat) startHold("keyboard");
    }
  });
  holdBtn.addEventListener("keyup", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      cancelHold();
    }
  });
  holdBtn.addEventListener("pointercancel", cancelHold);
  holdBtn.addEventListener("pointerup", cancelHold);
  holdBtn.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    holdBtn.setPointerCapture(event.pointerId);
    startHold("pointer");
  });

  /* Accounts page. */
  function renderAccounts() {
    const cur = account();
    accountsEl.innerHTML =
      '<button type="button" class="am-item am-back" data-menu-item="" data-row="back" role="menuitem" tabindex="-1">' +
      svg("chevron-left") +
      '<span class="sr-only">Back to </span>Switch account</button>' +
      '<hr class="am-hr">' +
      P.accounts
        .map((entry, index) => {
          const checked = entry.id === cur.id;
          const dot = checked ? dotOf(status) : "";
          return (
            `<button type="button" class="am-item am-acct" data-menu-item="" data-row="account-${esc(entry.id)}" role="menuitemradio" tabindex="-1" aria-checked="${checked}" data-id="${esc(entry.id)}">` +
            `<span class="am-av md ${TONE_CLASS[index % 3]}" aria-hidden="true">${esc(initialsOf(entry))}${dot ? `<span class="am-dot ${dot}"></span>` : ""}</span>` +
            `<span class="nm"><span class="n1">${esc(entry.name)}</span><span class="n2">${esc(entry.email)}</span></span>` +
            (checked ? `<span class="ck">${svg("check")}</span>` : "") +
            "</button>"
          );
        })
        .join("") +
      '<hr class="am-hr">' +
      '<button type="button" class="am-item am-add" data-menu-item="" data-row="add" role="menuitem" tabindex="-1">' +
      '<span class="plus">' + svg("plus") + '</span>Add account</button>';
    accountsEl.querySelector('[data-row="back"]').addEventListener("click", () => goTo("main"));
    accountsEl.querySelectorAll("[data-id]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const entry = P.accounts.find((a) => a.id === btn.dataset.id);
        if (btn.getAttribute("aria-checked") !== "true" && entry) {
          accountId = entry.id;
          P.onAccountChange?.(entry);
          renderIdentity();
        }
        goTo("main");
      });
    });
    accountsEl.querySelector('[data-row="add"]').addEventListener("click", (event) => select(event, P.onAddAccount));
  }

  /* Keyboard and pointer on the panel. */
  panel.addEventListener("keydown", (event) => {
    if (event.key === "Escape" || event.key === "Tab") {
      event.preventDefault();
      closeMenu("keyboard", true);
      return;
    }
    if (page === "accounts" && event.key === "Backspace") {
      event.preventDefault();
      goTo("main");
      return;
    }
    if (!NAV_KEYS.has(event.key)) return;
    event.preventDefault();
    const target = nextTarget(menuItems(pageEl(page)), document.activeElement, event.key);
    if (target) {
      target.focus({ preventScroll: true });
    } else if (page === "accounts" && event.key === "ArrowLeft") {
      goTo("main");
    } else if (event.key === "ArrowRight" && document.activeElement instanceof HTMLElement && document.activeElement.dataset.switch !== undefined) {
      goTo("accounts");
    }
  });
  panel.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;
    const item = event.target.closest?.("[data-menu-item]");
    if (item && document.activeElement !== item) {
      item.focus({ preventScroll: true });
    }
  });

  trigger.addEventListener("click", (event) => {
    const via = viaOf(event);
    openMenu(via, via === "keyboard" ? "first" : "menu");
  });
  trigger.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      openMenu("keyboard", event.key === "ArrowDown" ? "first" : "last");
    }
  });

  const onDown = (event) => {
    if (phase !== "open") return;
    if (!root.contains(event.target)) closeMenu("pointer", false);
  };
  document.addEventListener("pointerdown", onDown, true);

  /* Keep the height in step if a page changes size while open. */
  const resize = new ResizeObserver(() => {
    if (phase !== "open") return;
    const next = pageEl(page).offsetHeight;
    if (Math.abs(next - targetH) < 0.5) return;
    targetH = next;
    if (reduceQuery.matches) clock.jump(h, next);
    else clock.to(h, next);
  });
  resize.observe(mainPage);
  resize.observe(accountsPage);

  /* First paint of the static pieces. */
  renderIdentity();
  paintRows();
  placeThemeIndicator(true);
  reflectPhase();
  paintClip();
  paintPage();

  return {
    element: root,
    open: () => openMenu("pointer", "menu"),
    close: () => closeMenu("pointer", false),
    getStatus: () => status,
    getTheme: () => theme,
    getAccountId: () => accountId,
    destroy() {
      document.removeEventListener("pointerdown", onDown, true);
      resize.disconnect();
      clearTimeout(holdTimer);
      clearTimeout(nudgeTimer);
      root.remove();
    },
  };
}

/* The menu is the only component, so the helpers above are shared by one mount. */
window.AccountMenu = { mount: mountAccountMenu };

const logEl = document.getElementById("log");
const menuHost = document.getElementById("menu-host");
const menu = mountAccountMenu(menuHost, {
  onSignOut: () => { logEl.textContent = "Signed out (held for 1.2 s)."; },
  onAccountChange: (a) => { logEl.textContent = `Switched to ${a.name}.`; },
  onAddAccount: () => { logEl.textContent = "Add account chosen."; },
  onThemeChange: (t) => { logEl.textContent = `Theme: ${t}.`; },
  onStatusChange: (s) => { logEl.textContent = `Status: ${s}.`; },
});
window.accountMenu = menu;

const darkToggle = document.getElementById("toggle-dark");
darkToggle.addEventListener("click", () => {
  const on = document.documentElement.classList.toggle("dark");
  darkToggle.setAttribute("aria-pressed", String(on));
});
})();
</script>
</body>
</html>
