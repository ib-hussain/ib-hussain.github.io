name: Update movie profile
on:
  schedule:
    - cron: '28 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Refresh public Letterboxd data and cache posters
        run: python scripts/update_movies.py
      - name: Commit updated data
        run: |
          git add src/data/films.json src/movies/data/posters
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh movie profile from Letterboxd'
            git push
          fi
