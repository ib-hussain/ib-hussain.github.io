name: Refresh public site data
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public GitHub and Letterboxd data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_public_data.py
      - name: Commit changed JSON
        run: |
          git add data/github.json data/films.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh public metrics and film diary'
            git push
          fi
